<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1b4332">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Old Well">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<title>Old Well Mowing</title>
<script>
  // Cross-device sync backend. Set to '' to disable sync (localStorage-only mode).
  window.OLDWELL_SYNC_BASE = 'https://oldwell-mowing-api.vercel.app';
</script>
<style>
:root {
  --bg: #faf8f2;
  --surface: #ffffff;
  --surface-2: #f3f1e9;
  --border: #e6e3d8;
  --border-strong: #d3cfc1;
  --text: #1b2316;
  --text-soft: #555a4b;
  --text-muted: #8a8e7d;
  --green: #2d6a4f;
  --green-deep: #1b4332;
  --green-soft: #e6efe5;
  --green-pale: #f1f5ee;
  --amber: #b06f0f;
  --amber-soft: #faf0d8;
  --red: #9a3027;
  --red-soft: #f8e6e2;
  --blue: #2e4f7a;
  --blue-soft: #e2eaf3;
  --shadow-sm: 0 1px 2px rgba(27,35,22,.04);
  --shadow-md: 0 4px 14px rgba(27,35,22,.07);
  --shadow-lg: 0 12px 32px rgba(27,35,22,.10);
  color-scheme: light;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body {
  margin: 0; padding: 0;
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  font-size: 16px; line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  overscroll-behavior-y: none;
}
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: var(--green-deep); }
img { display: block; }

.app {
  max-width: 480px;
  margin: 0 auto;
  min-height: 100vh;
  min-height: 100dvh;
  background: var(--bg);
  display: flex; flex-direction: column;
  position: relative;
}

.topbar {
  position: sticky; top: 0; z-index: 30;
  background: var(--bg);
  padding: max(12px, env(safe-area-inset-top)) 16px 12px;
  display: flex; align-items: center; gap: 10px;
  border-bottom: 1px solid transparent;
  transition: border-color .2s, background .2s;
}
.topbar.scrolled {
  border-bottom-color: var(--border);
  background: rgba(250,248,242,.94);
  -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px);
}
.topbar h1 { margin: 0; font-size: 17px; font-weight: 600; letter-spacing: -.01em; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.topbar .icon-btn { width: 38px; height: 38px; border-radius: 50%; border: none; background: transparent; display: inline-flex; align-items: center; justify-content: center; color: var(--text-soft); transition: background .15s, color .15s; }
.topbar .icon-btn:active { background: var(--surface-2); color: var(--text); }
.topbar .right-btn {
  padding: 7px 12px; border-radius: 999px; border: 1px solid var(--border);
  background: var(--surface); color: var(--text); font-size: 13px; font-weight: 600;
  display: inline-flex; align-items: center; gap: 4px;
}
.topbar .right-btn.primary { background: var(--green-deep); border-color: var(--green-deep); color: #fff; }
.sync-pill {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 3px 9px 3px 7px; border-radius: 999px;
  font-size: 11px; font-weight: 600; letter-spacing: .02em;
  background: var(--surface-2); color: var(--text-muted);
  white-space: nowrap; flex-shrink: 0;
}

/* Avatar+name button in the topbar — tap anywhere on it to open the user switcher. */
.user-switcher {
  display: flex; align-items: center; gap: 10px;
  flex: 1; min-width: 0;
  padding: 4px 10px 4px 4px;
  border-radius: 999px;
  background: transparent; border: none;
  text-align: left;
  -webkit-tap-highlight-color: transparent;
}
.user-switcher:active { background: var(--surface-2); }
.user-switcher .user-name {
  flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  font-size: 17px; font-weight: 600; letter-spacing: -.01em; color: var(--text);
}
.user-switcher .switcher-hint {
  display: inline-flex; align-items: center; gap: 4px;
  flex-shrink: 0;
  padding: 4px 8px 4px 10px;
  border-radius: 999px;
  background: var(--surface-2);
  color: var(--text-soft);
  font-size: 12px; font-weight: 600; letter-spacing: .02em;
}
.user-switcher:active .switcher-hint { background: var(--border); }
.user-switcher .chev-down { color: var(--text-soft); flex-shrink: 0; }

.switcher-list { display: flex; flex-direction: column; gap: 8px; margin: 8px 0 16px; }
.switcher-row {
  display: flex; align-items: center; gap: 14px;
  padding: 14px 16px;
  background: var(--surface); border: 1px solid var(--border); border-radius: 14px;
  text-align: left; width: 100%;
  transition: transform .12s, border-color .15s;
  min-height: 64px;
}
.switcher-row:active { transform: scale(.99); border-color: var(--green); }
.switcher-row.current { border-color: var(--green); background: var(--green-pale); }
.switcher-row .avatar { flex-shrink: 0; }
.switcher-row .info { flex: 1; min-width: 0; }
.switcher-row .name { font-weight: 600; font-size: 16px; line-height: 1.25; }
.switcher-row .meta { color: var(--text-muted); font-size: 13px; margin-top: 2px; }
.switcher-row .check { color: var(--green-deep); font-size: 18px; font-weight: 700; flex-shrink: 0; }
.switcher-row.office { background: var(--green-deep); border-color: var(--green-deep); color: #fff; }
.switcher-row.office .name { color: #fff; }
.switcher-row.office .meta { color: rgba(255,255,255,.7); }
.switcher-row.office .avatar { background: rgba(255,255,255,.16); color: #fff; border-color: rgba(255,255,255,.2); }
.switcher-row.office.current { border-color: #fff; box-shadow: inset 0 0 0 2px rgba(255,255,255,.4); }
.switcher-row.office.current .check { color: #fff; }

.switcher-signout {
  width: 100%; min-height: 48px;
  padding: 12px;
  background: transparent; border: 1px solid var(--border); border-radius: 12px;
  font-size: 14px; font-weight: 600; color: var(--red);
  cursor: pointer;
}
.switcher-signout:active { background: var(--red-soft); }

.switcher-add-crew {
  width: 100%; min-height: 48px;
  padding: 12px;
  background: var(--surface); border: 1px dashed var(--border-strong); border-radius: 12px;
  font-size: 14px; font-weight: 600; color: var(--green-deep);
  cursor: pointer;
  margin-bottom: 8px;
}
.switcher-add-crew:active { background: var(--green-pale); border-color: var(--green); }

/* Crew contact chips in the office job sheet */
.crew-contact-row {
  display: flex; gap: 8px; flex-wrap: wrap;
  margin: 4px 0 12px;
}
.contact-btn {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 7px 14px;
  background: var(--green-pale); color: var(--green-deep);
  border: 1px solid var(--green-soft); border-radius: 999px;
  font-size: 13px; font-weight: 600;
  text-decoration: none;
  min-height: 36px;
}
.contact-btn:active { background: var(--green-soft); }
.sync-pill::before {
  content: ''; width: 6px; height: 6px; border-radius: 50%; background: currentColor;
}
.sync-pill.ok { background: var(--green-soft); color: var(--green-deep); }
.sync-pill.syncing { background: var(--blue-soft); color: var(--blue); }
.sync-pill.offline { background: var(--amber-soft); color: var(--amber); }

.signin { flex: 1; display: flex; flex-direction: column; padding: 24px 20px 40px; }
.signin .hero { margin-top: 28px; margin-bottom: 26px; }
.signin .badge {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 5px 12px; background: var(--green-soft); color: var(--green-deep);
  border-radius: 999px; font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase;
}
.signin h1 { margin: 16px 0 6px; font-size: 32px; font-weight: 700; line-height: 1.15; letter-spacing: -.02em; }
.signin .lede { color: var(--text-soft); font-size: 16px; }
.crew-list { display: flex; flex-direction: column; gap: 10px; }
.crew-card {
  width: 100%; text-align: left; padding: 14px 16px;
  background: var(--surface); border: 1px solid var(--border); border-radius: 14px;
  display: flex; align-items: center; gap: 14px;
  transition: transform .12s, box-shadow .15s, border-color .15s;
}
.crew-card:active { transform: scale(.985); border-color: var(--green); box-shadow: var(--shadow-md); }
.avatar {
  width: 44px; height: 44px; border-radius: 50%;
  background: var(--green-pale); color: var(--green-deep);
  display: inline-flex; align-items: center; justify-content: center;
  font-weight: 700; font-size: 15px; letter-spacing: .02em;
  border: 1px solid var(--green-soft); flex-shrink: 0;
}
.crew-card .name { font-weight: 600; font-size: 16px; line-height: 1.25; }
.crew-card .meta { font-size: 13px; color: var(--text-muted); margin-top: 2px; }
.crew-card .grow { flex: 1; min-width: 0; }
.crew-card .chev { color: var(--text-muted); margin-left: 8px; flex-shrink: 0; }
.crew-card.office { background: var(--green-deep); border-color: var(--green-deep); color: #fff; }
.crew-card.office .name { color: #fff; }
.crew-card.office .meta { color: rgba(255,255,255,.7); }
.crew-card.office .avatar { background: rgba(255,255,255,.16); color: #fff; border-color: rgba(255,255,255,.2); }
.crew-card.office .chev { color: rgba(255,255,255,.7); }
.signin .demo-note {
  margin-top: 28px; padding: 12px 14px; background: var(--surface-2);
  border-radius: 10px; font-size: 12px; color: var(--text-soft); line-height: 1.5;
}
.signin .demo-note button {
  background: none; border: none; color: var(--green-deep); padding: 0; font-weight: 600; text-decoration: underline;
}

.day-header { padding: 4px 20px 16px; }
.day-header .date { color: var(--text-muted); font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; }
.day-header h2 { margin: 4px 0 0; font-size: 28px; font-weight: 700; letter-spacing: -.02em; }
.day-header .subtitle { margin-top: 6px; color: var(--text-soft); font-size: 15px; }

.section-label { padding: 14px 20px 8px; color: var(--text-muted); font-size: 11px; font-weight: 700; letter-spacing: .09em; text-transform: uppercase; display: flex; align-items: baseline; gap: 8px; }
.section-label .count { color: var(--text-muted); font-weight: 600; }
.section-label .right { margin-left: auto; font-size: 12px; }

.stops { display: flex; flex-direction: column; gap: 10px; padding: 0 16px; }
.stops + .section-label { padding-top: 24px; }

.stop {
  background: var(--surface); border: 1px solid var(--border); border-radius: 14px;
  padding: 14px 16px;
  display: flex; flex-direction: column; gap: 8px;
  text-align: left; width: 100%;
  transition: transform .12s, border-color .15s, box-shadow .15s;
  position: relative;
}
.stop:active { transform: scale(.99); border-color: var(--border-strong); }
.stop.done { background: var(--green-pale); border-color: var(--green-soft); }
.stop.late { border-left: 3px solid var(--red); padding-left: 13px; }
.stop.way   { border-left: 3px solid var(--amber); padding-left: 13px; }
.stop.start { border-left: 3px solid var(--blue); padding-left: 13px; }
.stop.cancelled { opacity: .55; background: var(--surface-2); }
.stop .row1 { display: flex; align-items: flex-start; gap: 10px; }
.stop .nick { font-weight: 700; font-size: 17px; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.stop .when { color: var(--text-muted); font-size: 13px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.stop .row2 { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.stop .contractor { color: var(--text-soft); font-size: 13px; }
.stop .photo-count { color: var(--text-muted); font-size: 12px; display: inline-flex; align-items: center; gap: 3px; }

.empty-card {
  text-align: center; padding: 24px 20px;
  background: var(--surface); border: 1px dashed var(--border-strong); border-radius: 14px;
  color: var(--text-muted); font-size: 14px;
}

.chip {
  display: inline-flex; align-items: center;
  padding: 3px 9px; border-radius: 6px;
  font-size: 11px; font-weight: 700; letter-spacing: .04em;
  background: var(--surface-2); color: var(--text-soft);
}
.chip.LUX { background: #f4ecd8; color: #6e4d10; }
.chip.VAC1 { background: var(--blue-soft); color: var(--blue); }
.chip.VAC2 { background: #e7e7f1; color: #3b3768; }
.chip.RNT { background: #ece5f1; color: #553772; }

.status {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 3px 10px; border-radius: 999px; font-size: 12px; font-weight: 600;
}
.status.done { background: var(--green-soft); color: var(--green-deep); }
.status.way { background: var(--amber-soft); color: var(--amber); }
.status.start { background: var(--blue-soft); color: var(--blue); }
.status.late { background: var(--red-soft); color: var(--red); }
.status.cancelled { background: var(--surface-2); color: var(--text-muted); }
.status .dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }

/* ===== Crew job detail ===== */
.job { flex: 1; display: flex; flex-direction: column; padding-bottom: 140px; }
.job-hero { padding: 0 20px 20px; }
.job-hero .meta { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.job-hero .scheduled { color: var(--text-soft); font-size: 14px; }
.job-hero .nick { font-size: 30px; font-weight: 800; letter-spacing: -.02em; margin: 6px 0 0; line-height: 1.1; }
.job-hero .by { margin-top: 6px; color: var(--text-soft); font-size: 14px; }
.job-hero .live-status { margin-top: 10px; }

.panel {
  background: var(--surface); border: 1px solid var(--border); border-radius: 14px;
  margin: 0 16px 10px; padding: 14px 16px;
}
.panel h3 { margin: 0 0 8px; font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--text-muted); display: flex; align-items: baseline; gap: 8px; }
.panel h3 .right { margin-left: auto; }
.panel .last-photo {
  width: 100%; aspect-ratio: 4/3; object-fit: cover; border-radius: 10px; margin-top: 4px; display: block; background: var(--surface-2); cursor: zoom-in;
}
.panel .last-meta { margin-top: 6px; font-size: 13px; color: var(--text-soft); }
.panel .empty { color: var(--text-muted); font-size: 14px; padding: 6px 0; }

textarea.notes {
  width: 100%; min-height: 84px;
  background: var(--bg); border: 1px solid var(--border); border-radius: 10px;
  padding: 12px; color: var(--text); resize: vertical;
  transition: border-color .15s, box-shadow .15s, background .15s;
  font-size: 15px;
}
textarea.notes:focus { outline: none; border-color: var(--green); background: #fff; box-shadow: 0 0 0 3px var(--green-soft); }

.photo-strip { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 4px; }
.photo-tile { aspect-ratio: 1; border-radius: 8px; overflow: hidden; background: var(--surface-2); border: 1px solid var(--border); position: relative; cursor: zoom-in; }
.photo-tile img { width: 100%; height: 100%; object-fit: cover; }
.photo-tile .rm { position: absolute; top: 4px; right: 4px; width: 22px; height: 22px; border-radius: 50%; background: rgba(0,0,0,.55); color: #fff; border: none; display: flex; align-items: center; justify-content: center; font-size: 13px; }
.photo-add { aspect-ratio: 1; border-radius: 8px; border: 1.5px dashed var(--border-strong); background: var(--bg); color: var(--text-muted); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 11px; font-weight: 600; cursor: pointer; transition: border-color .15s, color .15s, background .15s; }
.photo-add .plus { font-size: 22px; line-height: 1; }
.photo-add:active { border-color: var(--green); color: var(--green-deep); background: var(--green-pale); }

.action-bar {
  position: fixed; bottom: 0; left: 0; right: 0;
  z-index: 40;
  padding: 16px 16px calc(14px + env(safe-area-inset-bottom));
  background: linear-gradient(180deg, rgba(250,248,242,0) 0%, var(--bg) 36%);
  pointer-events: none;
}
.action-bar .inner { max-width: 480px; margin: 0 auto; display: flex; flex-direction: column; gap: 8px; pointer-events: auto; }
.action-bar .row { display: flex; gap: 8px; }

.btn {
  flex: 1;
  padding: 0 18px; border-radius: 12px; border: 1px solid var(--border);
  font-size: 16px; font-weight: 600; letter-spacing: -.01em;
  background: var(--surface); color: var(--text);
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  transition: transform .1s, background .15s, border-color .15s, opacity .15s;
  min-height: 52px;
}
.btn:active { transform: scale(.985); }
.btn.primary { background: var(--green); color: #fff; border-color: var(--green); box-shadow: 0 6px 16px rgba(45,106,79,.22); }
.btn.primary:active { background: var(--green-deep); }
.btn.amber { background: var(--amber); color: #fff; border-color: var(--amber); }
.btn.ghost { background: transparent; border-color: transparent; color: var(--text-soft); }
.btn.danger { background: transparent; color: var(--red); border-color: var(--red-soft); }
.btn.small { min-height: 40px; padding: 0 14px; font-size: 14px; }
.btn:disabled { opacity: .55; pointer-events: none; }

/* ===== Office shell ===== */
.page { padding-bottom: calc(96px + env(safe-area-inset-bottom)); }

.tabbar {
  position: fixed; bottom: 0; left: 0; right: 0;
  z-index: 35;
  display: flex; justify-content: center;
  background: rgba(250,248,242,.96);
  -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
  border-top: 1px solid var(--border);
  padding: 6px 6px calc(6px + env(safe-area-inset-bottom));
}
.tabbar .tabbar-inner { max-width: 480px; width: 100%; display: flex; justify-content: space-around; }
.tab {
  flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px;
  padding: 8px 4px; text-decoration: none;
  color: var(--text-muted); font-size: 11px; font-weight: 600;
  border-radius: 10px;
  transition: color .15s;
}
.tab:active { background: var(--surface-2); }
.tab.active { color: var(--green-deep); }
.tab .tab-icon { display: inline-flex; }
.tab .tab-icon svg { width: 22px; height: 22px; }

/* KPI strip */
.kpi-strip {
  display: grid; grid-template-columns: repeat(3, 1fr);
  gap: 8px; padding: 0 16px 4px;
}
.kpi-card {
  background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
  padding: 12px 10px;
  display: flex; flex-direction: column; gap: 2px;
}
.kpi-card .num {
  font-size: 24px; font-weight: 700; line-height: 1; letter-spacing: -.02em;
  font-variant-numeric: tabular-nums;
}
.kpi-card .label {
  font-size: 10px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--text-muted);
  margin-top: 6px;
}
.kpi-card.green .num { color: var(--green-deep); }
.kpi-card.amber .num { color: var(--amber); }
.kpi-card.red .num { color: var(--red); }
.kpi-card.blue .num { color: var(--blue); }

/* Activity feed */
.feed { padding: 0 16px; display: flex; flex-direction: column; gap: 8px; }
.feed-item {
  display: flex; gap: 12px; align-items: center;
  padding: 12px 14px;
  background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
  text-align: left; width: 100%;
}
.feed-item .dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
.feed-item .body { flex: 1; min-width: 0; font-size: 14px; }
.feed-item .body strong { font-weight: 600; }
.feed-item .time { color: var(--text-muted); font-size: 12px; margin-top: 2px; }
.feed-item .thumb { width: 44px; height: 44px; border-radius: 8px; object-fit: cover; flex-shrink: 0; background: var(--surface-2); }
.feed-item.done .dot { background: var(--green); }
.feed-item.start .dot { background: var(--blue); }
.feed-item.way .dot { background: var(--amber); }
.feed-item.late .dot { background: var(--red); }
.feed-empty { padding: 24px; text-align: center; color: var(--text-muted); font-size: 13px; background: var(--surface); border: 1px dashed var(--border); border-radius: 12px; margin: 0 16px; }

/* Horizontal photo strip */
.h-photo-strip {
  display: flex; gap: 8px; padding: 0 16px 4px;
  overflow-x: auto; -webkit-overflow-scrolling: touch;
  scrollbar-width: none;
}
.h-photo-strip::-webkit-scrollbar { display: none; }
.h-photo-strip .photo {
  width: 120px; height: 120px; flex-shrink: 0;
  border-radius: 10px; overflow: hidden; background: var(--surface-2);
  position: relative; cursor: zoom-in;
}
.h-photo-strip .photo img { width: 100%; height: 100%; object-fit: cover; }
.h-photo-strip .photo .cap {
  position: absolute; bottom: 0; left: 0; right: 0; padding: 14px 8px 6px;
  background: linear-gradient(180deg, transparent, rgba(0,0,0,.7));
  color: #fff; font-size: 11px; font-weight: 600;
}

/* Day group on schedule */
.day-group { margin-bottom: 2px; }
.day-group-head { display: flex; align-items: baseline; gap: 8px; padding: 18px 20px 8px; }

<body>
<div class="app" id="app">
  <div class="center-state" style="min-height: 100dvh;">
    <div class="glyph">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10Z"/><path d="M2 21c0-3 1.85-5.36 5.08-6"/></svg>
    </div>
    <h3>Loading…</h3>
  </div>
</div>
<div class="toast" id="toast"></div>
<div class="sheet-overlay" id="sheet-overlay" onclick="closeSheet()"></div>
<div class="sheet" id="sheet">
  <div class="sheet-handle"></div>
  <div class="sheet-body" id="sheet-body"></div>
</div>
<div class="lightbox" id="lightbox" onclick="closeLightbox()">
  <button class="close" onclick="event.stopPropagation(); closeLightbox()">×</button>
  <img id="lightbox-img" src="" alt="">
</div>

<script>
const DATA_URL = '../data.json';
const EVENTS_URL = '../events.json';
const STATE_KEY = 'oldwell-field-v1';
const WEEK_LOOKAHEAD = 7;
const UPCOMING_LOOKAHEAD = 21;
// Where crew taps "Notify office" — the already-monitored shared mailbox.
const OFFICE_EMAIL = 'mow@oldwellco.com';
// Cross-device sync. Set window.OLDWELL_SYNC_BASE to the Vercel project URL
// (e.g. "https://oldwell-mowing.vercel.app") to enable cloud writeback.
// When unset, the app falls back to localStorage-only + the mailto Notify path.
const SYNC_BASE = (typeof window !== 'undefined' && window.OLDWELL_SYNC_BASE) || '';
const SYNC_POLL_MS = 30000;

const TYPE_LABELS = { LUX: 'Lux', VAC1: 'Vacant 1', VAC2: 'Vacant 2', RNT: 'Rental' };
const TYPE_OPTIONS = ['LUX', 'VAC1', 'VAC2', 'RNT'];

// Monthly cadence in days, indexed by 1-based month. Null = dormant (no mow).
// Source: project memory — agronomic spec for NC Piedmont, 2026 cadence settings.
const CADENCE_DAYS = {
  LUX:  { 3: 14, 4:  8, 5:  7, 6:  7, 7: 11, 8: 11, 9: 12, 10: 14 },
  RNT:  { 3: 30, 4: 14, 5: 14, 6: 14, 7: 14, 8: 14, 9: 17, 10: 30 },
  VAC1: { 3: 14, 4: 14, 5: 14, 6: 14, 7: 14, 8: 14, 9: 14, 10: 14 },
  VAC2: { 3: 30, 4: 30, 5: 30, 6: 30, 7: 30, 8: 30, 9: 30, 10: 30 },
};
const SEASON_END_MONTH = 10; // October
const SEASON_END_DAY = 31;

function cadenceDaysFor(typeId, dateObj) {
  if (!dateObj || !typeId) return null;
  const month = dateObj.getUTCMonth() + 1;
  return CADENCE_DAYS[typeId]?.[month] ?? null;
}

// Walk forward by cadence-for-each-month. Returns array of noon-UTC ISO dates.
// Stops at end of season (Oct 31) or when no remaining cadence applies.
function generateSeasonDates(typeId, fromDateUtc, seasonYear) {
  const out = [];
  if (!CADENCE_DAYS[typeId]) return out;
  const endOfSeason = Date.UTC(seasonYear, SEASON_END_MONTH - 1, SEASON_END_DAY, 12, 0, 0);
  // First mow = the start date itself (anchored, not stepped).
  let cur = new Date(fromDateUtc);
  cur.setUTCHours(12, 0, 0, 0);
  if (cur.getTime() > endOfSeason) return out;
  out.push(new Date(cur));
  for (let i = 0; i < 60; i++) {
    const days = cadenceDaysFor(typeId, cur);
    if (!days) break; // dormant — done
    const nxt = new Date(cur);
    nxt.setUTCDate(nxt.getUTCDate() + days);
    nxt.setUTCHours(12, 0, 0, 0);
    if (nxt.getTime() > endOfSeason) break;
    if (!cadenceDaysFor(typeId, nxt)) break; // next month is dormant
    out.push(nxt);
    cur = nxt;
  }
  return out;
}

// LUX uses a 4-cycle pattern rotation (N→S, E→W, NW→SE, NE→SW).
// Sessions 1..4 then loop. Other types stay at 1.
function sessionNumberFor(typeId, indexInSeason) {
  if (typeId === 'LUX') return ((indexInSeason % 4) + 1);
  return 1;
}

let state = loadState();
let data = null;
let officeUi = { scheduleWeekOffset: 0, propertySort: 'overdue', photosFilter: 'all', contractorFilter: 'all' };

function loadState() {
  try {
    const s = JSON.parse(localStorage.getItem(STATE_KEY)) || {};
    if (!s.jobUpdates) s.jobUpdates = {};
    if (!s.customJobs) s.customJobs = [];
    if (!s.crews) s.crews = [];
    if (!s.properties) s.properties = [];
    if (!s.signedInAs) s.signedInAs = null;
    return s;
  } catch { return { signedInAs: null, jobUpdates: {}, customJobs: [], crews: [], properties: [] }; }
}
function saveState() { localStorage.setItem(STATE_KEY, JSON.stringify(state)); }
// Use when mutating a specific job's overlay — persists locally AND pushes to sync API.
// Pass customJob (the full job object) on first save of a brand-new office-created job.
function saveJob(jobId, customJob) {
  saveState();
  if (jobId) pushEvent(jobId, customJob);
}
function jobUpdate(jobId) {
  if (!state.jobUpdates[jobId]) state.jobUpdates[jobId] = {};
  state.jobUpdates[jobId].lastUpdate = new Date().toISOString();
  if (state.signedInAs) state.jobUpdates[jobId].updatedBy = state.signedInAs;
  return state.jobUpdates[jobId];
}

/* ===== Cross-device sync =====
 * Reads events.json (server overlays) and merges into localStorage on load + poll.
 * Posts every change to /api/event (debounced per job). Last-write-wins per JobID,
 * gated by lastUpdate timestamp so a slow phone can't clobber newer state.
 */
const syncState = { lastPullAt: null, lastPushAt: null, pending: new Map(), polling: null, online: navigator.onLine !== false };

async function pullRemoteEvents() {
  try {
    const r = await fetch(EVENTS_URL + '?t=' + Date.now(), { cache: 'no-store' });
    if (r.status === 404) { syncState.lastPullAt = Date.now(); return; }
    if (!r.ok) throw new Error('events.json ' + r.status);
    const remote = await r.json();
    mergeRemote(remote);
    syncState.lastPullAt = Date.now();
    updateSyncIndicator();
  } catch (e) {
    console.warn('pull events failed', e);
  }
}

function mergeRemote(remote) {
  if (!remote || typeof remote !== 'object') return;
  let changed = false;
  // 1) Apply tombstones first. If server says jobId is deleted AND local hasn't
  // edited it since the tombstone, drop the local copy.
  const tombs = remote.tombstones || {};
  for (const [jobId, deletedAt] of Object.entries(tombs)) {
    const local = state.jobUpdates[jobId];
    if (local && (local.lastUpdate || '') <= deletedAt) {
      delete state.jobUpdates[jobId];
      changed = true;
    }
    // Same logic for custom jobs (office-created)
    const before = state.customJobs.length;
    state.customJobs = state.customJobs.filter(j => j.JobID !== jobId);
    if (state.customJobs.length !== before) changed = true;
  }
  // 2) Apply remote events. Server wins on timestamp tie (server is canonical).
  for (const [jobId, server] of Object.entries(remote.events || {})) {
    const local = state.jobUpdates[jobId];
    const localTime = local?.lastUpdate || '';
    const serverTime = server?.lastUpdate || '';
    if (!local || serverTime >= localTime) {
      state.jobUpdates[jobId] = { ...server };
      changed = true;
    }
  }
  // 3) Pull in any new custom jobs from the server
  for (const job of (remote.customJobs || [])) {
    if (tombs[job.JobID]) continue; // skip tombstoned
    if (!state.customJobs.find(j => j.JobID === job.JobID)) {
      state.customJobs.push(job);
      changed = true;
    }
  }
  // 4) Merge crews. Server list is canonical; keep local-only entries that
  // haven't synced yet (optimistic adds) so an offline crew add doesn't vanish.
  const remoteCrews = remote.crews || [];
  if (remoteCrews.length || (state.crews && state.crews.length)) {
    state.crews = state.crews || [];
    const serverNames = new Set(remoteCrews.map(c => c.name));
    const localPending = state.crews.filter(c => !serverNames.has(c.name));
    const merged = [...remoteCrews, ...localPending];
    if (JSON.stringify(merged) !== JSON.stringify(state.crews)) {
      state.crews = merged;
      changed = true;
    }
  }
  // 5) Merge properties metadata (same shape as crews: server canonical + local optimistic)
  const remoteProps = remote.properties || [];
  if (remoteProps.length || (state.properties && state.properties.length)) {
    state.properties = state.properties || [];
    const serverIds = new Set(remoteProps.map(p => p.id));
    const localPending = state.properties.filter(p => !serverIds.has(p.id));
    const merged = [...remoteProps, ...localPending];
    if (JSON.stringify(merged) !== JSON.stringify(state.properties)) {
      state.properties = merged;
      changed = true;
    }
  }
  if (changed) {
    saveState();
    if (typeof render === 'function' && document.getElementById('app')) render();
  }
}

function pushEvent(jobId, customJob) {
  if (!SYNC_BASE) return; // sync disabled — localStorage only
  const u = state.jobUpdates[jobId];
  if (!u) return;
  // Debounce per-job so a rapid burst of saves coalesces into one POST
  const existing = syncState.pending.get(jobId);
  if (existing) clearTimeout(existing.timer);
  const timer = setTimeout(() => doPushEvent(jobId, customJob), 600);
  syncState.pending.set(jobId, { timer, customJob });
}

async function doPushEvent(jobId, customJob) {
  syncState.pending.delete(jobId);
  const u = state.jobUpdates[jobId];
  if (!u) return;
  // Strip base64 dataUrl from photos before POST — keep only the synced cloud `url`.
  // Photos without a URL yet (still uploading) are skipped; they'll sync on the next push.
  const eventForWire = { ...u };
  if (u.photos) {
    eventForWire.photos = u.photos
      .filter(p => p.url)
      .map(p => ({ id: p.id, url: p.url, takenAt: p.takenAt, takenBy: p.takenBy }));
  }
  try {
    const r = await fetch(SYNC_BASE + '/api/event', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ jobId, event: eventForWire, customJob }),
    });
    if (!r.ok) throw new Error('event POST ' + r.status);
    syncState.lastPushAt = Date.now();
    updateSyncIndicator();
  } catch (e) {
    console.warn('push event failed', e);
    showToast('Saved on phone — sync will retry');
    // Retry on next poll cycle by re-queueing
    setTimeout(() => pushEvent(jobId, customJob), 15000);
  }
}

async function deleteEntry(jobId) {
  // Optimistic local delete: drop overlay + any custom-job entry immediately.
  delete state.jobUpdates[jobId];
  state.customJobs = (state.customJobs || []).filter(j => j.JobID !== jobId);
  saveState();
  if (typeof render === 'function') render();
  if (!SYNC_BASE) return true;
  try {
    const r = await fetch(SYNC_BASE + '/api/delete', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ jobId, deletePhotos: true }),
    });

    updateSyncIndicator();

  } catch (e) {

async function uploadPhoto(jobId, dataUrl, filename) {

function startSyncLoop() {
  if (!SYNC_BASE) return;
  if (syncState.polling) clearInterval(syncState.polling);
  syncState.polling = setInterval(() => { if (syncState.online) pullRemoteEvents(); }, SYNC_POLL_MS);
  window.addEventListener('online', () => { syncState.online = true; pullRemoteEvents(); });
  window.addEventListener('offline', () => { syncState.online = false; updateSyncIndicator(); });
}

function updateSyncIndicator() {
  const el = document.getElementById('sync-pill');
  if (!el) return;
  if (!SYNC_BASE) { el.textContent = 'Local only'; el.className = 'sync-pill offline'; return; }
  if (!syncState.online) { el.textContent = 'Offline'; el.className = 'sync-pill offline'; return; }
  const ts = Math.max(syncState.lastPullAt || 0, syncState.lastPushAt || 0);
  if (!ts) { el.textContent = 'Syncing…'; el.className = 'sync-pill syncing'; return; }
  const age = Math.round((Date.now() - ts) / 1000);
  el.textContent = age < 60 ? 'Synced' : Math.round(age / 60) + 'm ago';
  el.className = 'sync-pill ok';
}

function isCancelled(job) { return !!state.jobUpdates[job.JobID]?.cancelled; }
function effectiveDate(job) {
  const u = state.jobUpdates[job.JobID];
  return new Date(u?.rescheduledTo || job.ScheduledDate);
}
function effectiveContractor(job) {
  const u = state.jobUpdates[job.JobID];
  return u?.reassignedTo || job.ContractorName;
}
function effectiveType(job) {
  const u = state.jobUpdates[job.JobID];
  return u?.typeOverride || job.TypeID;
}
function effectiveStatus(job) {
  const u = state.jobUpdates[job.JobID];
  if (u?.cancelled) return 'Cancelled';
  if (u?.status) return u.status;
  return job.Status === 'Done' ? 'Done' : 'Pending';
}
function allJobs() { return [...(data?.jobs || []), ...(state.customJobs || [])]; }
function activeJobs() { return allJobs().filter(j => !isCancelled(j)); }

function parseDate(iso) { return new Date(iso); }
function startOfToday() { const d = new Date(); d.setHours(0,0,0,0); return d; }
function isSameDay(a, b) { return a.getFullYear()===b.getFullYear() && a.getMonth()===b.getMonth() && a.getDate()===b.getDate(); }
function dayStart(d) { const n = new Date(d); n.setHours(0,0,0,0); return n; }
function addDays(d, n) { const r = new Date(d); r.setDate(r.getDate()+n); return r; }
function daysBetween(a, b) { return Math.round((dayStart(a) - dayStart(b)) / 86400000); }
function shortDate(d) { return d.toLocaleDateString('en-US', {month:'short', day:'numeric'}); }
function isoDateLocal(d) { return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); }
function dayLabel(d) {
  const diff = daysBetween(d, startOfToday());
  if (diff === 0) return 'Today';
  if (diff === 1) return 'Tomorrow';
  if (diff === -1) return 'Yesterday';
  if (diff > 1 && diff <= 6) return d.toLocaleDateString('en-US', {weekday:'long'});
  return d.toLocaleDateString('en-US', {weekday:'short', month:'short', day:'numeric'});
}
function timeAgo(iso) {
  const m = Math.round((Date.now() - new Date(iso).getTime()) / 60000);
  if (m < 1) return 'just now';
  if (m < 60) return m + ' min ago';
  const h = Math.round(m / 60);
  if (h < 24) return h + 'h ago';
  return new Date(iso).toLocaleDateString('en-US', {month:'short', day:'numeric'});
}
function weekStartFor(date) {
  const d = dayStart(date);
  const dow = d.getDay(); // 0 = Sun
  return addDays(d, -((dow + 6) % 7)); // back to Monday
}

async function init() {

    else if (route.name === 'schedule') { app.innerHTML = officeShell('schedule', officeScheduleScreen()); attachOfficeScheduleHandlers(); }

    else if (route.name === 'photos') { app.innerHTML = officeShell('photos', officePhotosScreen()); attachOfficePhotosHandlers(); }

function parseRoute() {

  if (h === 'schedule' || h === 'properties' || h === 'photos' || h === 'today') return { name: h };
  return { name: 'day' };

/* ===== Crew: My Day ===== */
function bucketJobs(jobs) {
  const today = startOfToday();
  const todayB = [], completedToday = [], thisWeek = [], upcoming = [];
  for (const j of jobs) {
    if (isCancelled(j)) continue;
    const date = effectiveDate(j);
    const diff = daysBetween(date, today);
    const u = state.jobUpdates[j.JobID];
    const finishedToday = u?.finishedAt && isSameDay(new Date(u.finishedAt), today);
    const status = effectiveStatus(j);
    const item = Object.assign({}, j, { _date: date, _diff: diff });
    if (finishedToday) { completedToday.push(item); continue; }
    if (status === 'Done') continue;
    if (diff <= 0) todayB.push(item);
    else if (diff <= WEEK_LOOKAHEAD) thisWeek.push(item);
    else if (diff <= UPCOMING_LOOKAHEAD) upcoming.push(item);
  }
  todayB.sort((a,b) => a._date - b._date);
  thisWeek.sort((a,b) => a._date - b._date);
  upcoming.sort((a,b) => a._date - b._date);
  completedToday.sort((a,b) => new Date((state.jobUpdates[b.JobID]||{}).finishedAt||0) - new Date((state.jobUpdates[a.JobID]||{}).finishedAt||0));
  return { today: todayB, completedToday, thisWeek, upcoming };
}

  return `

      </button>

function dayHeaderSubtitle(today, done, week) {
  if (today.length === 0 && done.length === 0 && week.length === 0) return 'No stops on deck this week.';
  if (today.length === 0 && done.length === 0) return `No stops today — ${week.length} on deck this week.`;
  if (today.length === 0 && done.length > 0) return `All ${done.length} done — nice work.`;
  const late = today.filter(t => t._diff < 0).length;
  if (late > 0) return `${today.length} to go${done.length ? ` · ${done.length} done` : ''} · ${late} catch-up${late>1?'s':''}.`;
  return `${today.length} ${today.length===1?'stop':'stops'} to knock out${done.length ? ` · ${done.length} done` : ''}.`;
}

function stopCard(j, opts = {}) {
  const status = effectiveStatus(j);
  const u = state.jobUpdates[j.JobID] || {};
  const date = j._date || effectiveDate(j);
  const diff = j._diff != null ? j._diff : daysBetween(date, startOfToday());
  const photos = (u.photos || []).length;
  const showContractor = opts.alwaysShowContractor || state.signedInAs === 'OFFICE_ALL';

  let whenText;
  if (diff === 0) whenText = 'Today';
  else if (diff === 1) whenText = 'Tomorrow';
  else if (diff < 0) whenText = Math.abs(diff) + 'd late';
  else if (diff <= 6) whenText = date.toLocaleDateString('en-US', {weekday: 'short'}) + ' ' + (date.getMonth()+1) + '/' + date.getDate();
  else whenText = (date.getMonth()+1) + '/' + date.getDate();

  let cardCls = '';
  let statusPill = '';
  if (status === 'Cancelled') { cardCls = ' cancelled'; statusPill = `<span class="status cancelled"><span class="dot"></span>Cancelled</span>`; }
  else if (status === 'Done') { cardCls = ' done'; statusPill = `<span class="status done"><span class="dot"></span>Done${u.finishedAt ? ' · ' + timeAgo(u.finishedAt) : ''}</span>`; }
  else if (status === 'InProgress') { cardCls = ' start'; statusPill = `<span class="status start"><span class="dot"></span>In progress</span>`; }
  else if (status === 'OnWay') { cardCls = ' way'; statusPill = `<span class="status way"><span class="dot"></span>On the way</span>`; }
  else if (diff < 0) { cardCls = ' late'; statusPill = `<span class="status late"><span class="dot"></span>${Math.abs(diff)}d late</span>`; }

  const dataAttr = opts.openSheet ? `data-sheet-job="${escAttr(j.JobID)}"` : `data-job="${escAttr(j.JobID)}"`;
  return `
    <button class="stop${cardCls}" ${dataAttr}>
      <div class="row1">
        <div class="nick">${esc(j.PropertyNickname || '?')}</div>
        <div class="when">${esc(whenText)}</div>
      </div>
      <div class="row2">
        <span class="chip ${esc(effectiveType(j) || '')}">${esc(effectiveType(j) || '?')}</span>
        ${showContractor ? `<span class="contractor">${esc(effectiveContractor(j) || '')}</span>` : ''}
        ${statusPill}
        ${photos > 0 ? `<span class="photo-count">📷 ${photos}</span>` : ''}
      </div>
    </button>
  `;
}

function attachJobHandlers(jobId) {
  const back = document.getElementById('back-btn');
  if (back) back.addEventListener('click', () => go('/'));
  const notes = document.getElementById('notes-input');
  if (notes) {
    let saveTimer;
    notes.addEventListener('input', () => {
      clearTimeout(saveTimer);
      saveTimer = setTimeout(() => { const u = jobUpdate(jobId); u.notes = notes.value; saveJob(jobId); }, 350);
    });
  }
  const photoInput = document.getElementById('photo-input');
  if (photoInput) photoInput.addEventListener('change', async (e) => {
    const files = Array.from(e.target.files || []);
    if (!files.length) return;
    let added = 0;
    const newPhotos = [];
    for (const f of files) {
      try {
        const dataUrl = await fileToResizedDataUrl(f, 1280);
        const u = jobUpdate(jobId);
        if (!u.photos) u.photos = [];
        const photo = { id: 'p_' + Date.now() + '_' + Math.random().toString(36).slice(2,7), dataUrl, takenAt: new Date().toISOString(), takenBy: state.signedInAs };
        u.photos.push(photo);
        newPhotos.push({ photo, filename: f.name || 'photo.jpg' });
        added++;
      } catch (err) { console.warn('photo error', err); }
    }
    saveJob(jobId);
    e.target.value = '';
    render();
    if (added > 0) showToast(added + (added === 1 ? ' photo added' : ' photos added'));
    // Upload to API in background so other devices see it. Photo gets a `url` field
    // once uploaded; the next saveJob will sync those URLs (event.js strips dataUrl).
    for (const { photo, filename } of newPhotos) {
      uploadPhoto(jobId, photo.dataUrl, filename).then(url => {
        if (!url) return;
        const u = jobUpdate(jobId);
        const p = (u.photos || []).find(x => x.id === photo.id);
        if (p) { p.url = url; saveJob(jobId); }
      });
    }
  });

  document.querySelectorAll('[data-zoom]').forEach(el => {
    el.addEventListener('click', (ev) => { if (ev.target.matches('[data-rm]')) return; openLightbox(el.dataset.zoom); });
  });
  document.querySelectorAll('[data-rm]').forEach(btn => {
    btn.addEventListener('click', (ev) => {
      ev.stopPropagation();
      const id = btn.dataset.rm;
      const u = jobUpdate(jobId);
      u.photos = (u.photos || []).filter(p => p.id !== id);
      saveJob(jobId); render();
    });
  });

  document.querySelectorAll('[data-act]').forEach(btn => {
    btn.addEventListener('click', () => {
      const act = btn.dataset.act;
      const u = jobUpdate(jobId);
      const now = new Date().toISOString();
      if (act === 'onway') { u.onMyWayAt = now; u.status = 'OnWay'; saveJob(jobId); showToast('Marked on the way'); render(); }
      else if (act === 'start') {
        u.startedAt = now; if (!u.onMyWayAt) u.onMyWayAt = now;
        u.status = 'InProgress'; saveJob(jobId); showToast('Job started'); render();
      } else if (act === 'finish') {
        u.finishedAt = now; u.status = 'Done'; saveJob(jobId);
        if (navigator.geolocation) navigator.geolocation.getCurrentPosition(
          pos => { u.finishedLat = pos.coords.latitude; u.finishedLng = pos.coords.longitude; u.finishedAccuracy = pos.coords.accuracy; saveJob(jobId); },
          () => {}, { timeout: 6000, maximumAge: 60000, enableHighAccuracy: false }
        );
        showToast('Job complete — sending update to office');
        // Recompute downstream schedule for this property from the actual finish date.
        cascadeFinishedProperty(job, now);
        render();
        // Give geolocation a moment, then open the mail app with the structured update.
        setTimeout(() => notifyOffice(job), 800);
      } else if (act === 'undo') {
        delete u.status; delete u.finishedAt; delete u.startedAt; delete u.onMyWayAt;
        delete u.finishedLat; delete u.finishedLng; delete u.finishedAccuracy;
        saveJob(jobId); showToast('Re-opened'); render();
      } else if (act === 'uncancel') {
        delete u.cancelled; saveJob(jobId); showToast('Restored'); render();
      } else if (act === 'notify') {
        notifyOffice(job);
      }
    });
  });
}

/* ===== Cascade-on-finish =====
 * When a job is finished, recompute the dates of subsequent pending jobs for
 * the same property — anchored to the actual finish date + cadence-for-month.
 * Touches only later pending jobs; earlier catch-ups stay alone.
 */
function cascadeFinishedProperty(finishedJob, finishedAtIso) {
  const typeId = effectiveType(finishedJob);
  if (!CADENCE_DAYS[typeId]) return; // unknown type, no cascade
  const propKey = finishedJob.PropertyID || finishedJob.PropertyNickname;
  if (!propKey) return;
  const finishedDate = new Date(finishedAtIso);
  finishedDate.setUTCHours(12, 0, 0, 0);
  const seasonYear = finishedDate.getUTCFullYear();
  const endOfSeason = Date.UTC(seasonYear, SEASON_END_MONTH - 1, SEASON_END_DAY, 12, 0, 0);

  // Pull this property's pending jobs, scheduled AFTER the finished job's effective date.
  const finishedEff = effectiveDate(finishedJob);
  const propJobs = activeJobs()
    .filter(j => (j.PropertyID || j.PropertyNickname) === propKey)
    .filter(j => j.JobID !== finishedJob.JobID)
    .filter(j => effectiveStatus(j) === 'Pending')
    .filter(j => effectiveDate(j) > finishedEff)
    .sort((a, b) => effectiveDate(a) - effectiveDate(b));
  if (!propJobs.length) return;

  // Walk forward: each next date = prev date + cadence(month of prev).
  let prev = finishedDate;
  let cascaded = 0, cancelled = 0;
  for (const j of propJobs) {
    const days = cadenceDaysFor(typeId, prev);
    if (!days) {
      // Already in dormant — remaining jobs get auto-cancelled (rolled to next season).
      const u = jobUpdate(j.JobID);
      u.cancelled = true;
      u.cancelReason = 'cascade: dormant season';
      saveJob(j.JobID);
      cancelled++;
      continue;
    }
    const nxt = new Date(prev);
    nxt.setUTCDate(nxt.getUTCDate() + days);
    nxt.setUTCHours(12, 0, 0, 0);
    if (nxt.getTime() > endOfSeason) {
      const u = jobUpdate(j.JobID);
      u.cancelled = true;
      u.cancelReason = 'cascade: past season end';
      saveJob(j.JobID);
      cancelled++;
      prev = nxt; // keep walking so deeper jobs also get cancelled
      continue;
    }
    const u = jobUpdate(j.JobID);
    u.rescheduledTo = nxt.toISOString();
    u.cascadedFrom = finishedJob.JobID;
    saveJob(j.JobID);
    cascaded++;
    prev = nxt;
  }
  if (cascaded || cancelled) {
    const bits = [];
    if (cascaded) bits.push(`${cascaded} reschedul${cascaded === 1 ? 'ed' : 'es'}`);
    if (cancelled) bits.push(`${cancelled} rolled to next season`);
    showToast(`Schedule updated · ${bits.join(', ')}`);
  }
}

// Recompute the rest of a property's season anchored at today + cadence.
// Useful after un-cancellations, re-opens, or manual reschedules that have
// drifted out of step. Touches only pending jobs scheduled today-or-later;
// past-due catch-ups are left alone.
function recomputeProperty(propKey) {
  const propJobs = activeJobs().filter(j => (j.PropertyID || j.PropertyNickname) === propKey);
  if (!propJobs.length) { showToast('No jobs found for this property'); return; }
  const typeId = effectiveType(propJobs[0]);
  if (!CADENCE_DAYS[typeId]) { showToast(`Unknown cadence for type ${typeId}`); return; }

  const today = startOfToday();
  const todayNoonUtc = new Date(Date.UTC(today.getFullYear(), today.getMonth(), today.getDate(), 12, 0, 0));
  const seasonYear = todayNoonUtc.getUTCFullYear();
  const endOfSeason = Date.UTC(seasonYear, SEASON_END_MONTH - 1, SEASON_END_DAY, 12, 0, 0);

  const pending = propJobs
    .filter(j => effectiveStatus(j) === 'Pending')
    .filter(j => effectiveDate(j) >= today)
    .sort((a, b) => effectiveDate(a) - effectiveDate(b));
  if (!pending.length) { showToast('No pending future jobs to recompute'); return; }

  let prev = todayNoonUtc;
  let shifted = 0, cancelled = 0;
  for (const j of pending) {
    const days = cadenceDaysFor(typeId, prev);
    if (!days) {
      const u = jobUpdate(j.JobID);
      u.cancelled = true; u.cancelReason = 'recompute: dormant season';
      saveJob(j.JobID); cancelled++; continue;
    }
    const nxt = new Date(prev);
    nxt.setUTCDate(nxt.getUTCDate() + days);
    nxt.setUTCHours(12, 0, 0, 0);
    if (nxt.getTime() > endOfSeason) {
      const u = jobUpdate(j.JobID);
      u.cancelled = true; u.cancelReason = 'recompute: past season end';
      saveJob(j.JobID); cancelled++; prev = nxt; continue;
    }
    const u = jobUpdate(j.JobID);
    u.rescheduledTo = nxt.toISOString();
    u.recomputedAt = new Date().toISOString();
    delete u.cascadedFrom;
    saveJob(j.JobID);
    shifted++; prev = nxt;
  }
  const bits = [];
  if (shifted) bits.push(`${shifted} reschedul${shifted === 1 ? 'ed' : 'es'}`);
  if (cancelled) bits.push(`${cancelled} rolled to next season`);
  showToast(`Schedule recomputed · ${bits.join(', ')}`);
  render();
}

async function doEditProperty(propKey, sampleJob) {
  const newContractor = document.getElementById('edit-prop-contractor').value;
  const newNotes = document.getElementById('edit-prop-notes').value.trim();
  const propId = sampleJob.PropertyID || propKey;
  const nickname = sampleJob.PropertyNickname || propKey;
  const typeId = effectiveType(sampleJob);
  const now = new Date().toISOString();

  // Upsert local property record
  state.properties = state.properties || [];
  const idx = state.properties.findIndex(p => p.id === propId);
  const baseRecord = idx >= 0 ? state.properties[idx] : { id: propId, nickname, typeId, addedAt: now };
  const updatedRecord = {
    ...baseRecord,
    id: propId,
    nickname,
    typeId,
    contractor: newContractor,
    notes: newNotes || undefined,
    updatedAt: now,
    updatedBy: state.signedInAs || 'app',
  };
  for (const k of Object.keys(updatedRecord)) if (updatedRecord[k] === undefined) delete updatedRecord[k];
  if (idx >= 0) state.properties[idx] = updatedRecord;
  else state.properties.push(updatedRecord);

  // Bulk reassign every pending future job for this property
  const today = startOfToday();
  const pending = activeJobs().filter(j =>
    (j.PropertyID || j.PropertyNickname) === propKey &&
    effectiveStatus(j) === 'Pending' &&
    effectiveDate(j) >= today
  );
  let reassigned = 0;
  for (const j of pending) {
    if (effectiveContractor(j) !== newContractor) {
      const u = jobUpdate(j.JobID);
      u.reassignedTo = newContractor;
      saveJob(j.JobID);
      reassigned++;
    }
  }
  saveState();
  closeSheet();
  showToast(reassigned ? `Saved · ${reassigned} job${reassigned === 1 ? '' : 's'} reassigned` : 'Saved');
  render();

  // Sync the property record (metadata-only, jobs=[] — already reassigned per-job above)
  if (!SYNC_BASE) return;
  try {
    const r = await fetch(SYNC_BASE + '/api/property', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ property: updatedRecord, jobs: [] }),
    });
    if (!r.ok) throw new Error('property update ' + r.status);
    syncState.lastPushAt = Date.now();
    updateSyncIndicator();
  } catch (e) {
    console.warn('property edit sync failed', e);
    showToast('Saved on phone — sync will retry');
  }
}

async function doAddProperty() {
  const propId = document.getElementById('prop-id').value.trim().toUpperCase();
  const nick = document.getElementById('prop-nick').value.trim().toUpperCase();
  const typeId = document.getElementById('prop-type').value;
  const contractor = document.getElementById('prop-contractor').value;
  const startStr = document.getElementById('prop-season-start').value;
  if (!propId || !/^P[A-Z0-9-]{1,30}$/i.test(propId)) { showToast('Property ID required (e.g. P-013)'); return; }
  if (!nick) { showToast('Nickname required'); document.getElementById('prop-nick').focus(); return; }
  if (!typeId || !CADENCE_DAYS[typeId]) { showToast('Pick a type'); return; }
  if (!contractor) { showToast('Pick or add a contractor first'); return; }
  if (!startStr) { showToast('Pick a season start'); return; }

  // Collision check
  const allIds = new Set();
  for (const j of (data?.jobs || [])) if (j.PropertyID) allIds.add(j.PropertyID);
  for (const j of (state?.customJobs || [])) if (j.PropertyID) allIds.add(j.PropertyID);
  if (allIds.has(propId)) {
    if (!confirm(`${propId} already exists. Add another job series to it? (Use a new ID if this is a different property.)`)) return;
  }

  const start = new Date(startStr + 'T12:00:00Z');
  const seasonYear = start.getUTCFullYear();
  const dates = generateSeasonDates(typeId, start, seasonYear);
  if (!dates.length) { showToast('Season start is after Oct 31 — nothing to schedule'); return; }

  // Build the job records. Custom JobIDs use JX-{propId}-{index} so they don't collide with SharePoint's J-NNNN.
  const nowIso = new Date().toISOString();
  const jobs = dates.map((d, i) => ({
    ID: -(Date.now() + i),
    JobID: `JX-${propId}-${String(i + 1).padStart(2, '0')}`,
    PropertyID: propId,
    PropertyNickname: nick,
    ScheduledDate: d.toISOString(),
    SessionNumber: sessionNumberFor(typeId, i),
    Status: 'Pending',
    TypeID: typeId,
    ContractorName: contractor,
    Attachments: [],
    _createdAt: nowIso,
    _createdBy: state.signedInAs || 'app',
  }));

  // Optimistic local insert + render
  state.customJobs = state.customJobs || [];
  for (const j of jobs) {
    if (!state.customJobs.find(x => x.JobID === j.JobID)) state.customJobs.push(j);
  }
  saveState();
  closeSheet();
  showToast(`Added ${nick} · ${jobs.length} mow${jobs.length === 1 ? '' : 's'} scheduled`);
  render();

  if (!SYNC_BASE) return;
  try {
    const r = await fetch(SYNC_BASE + '/api/property', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        property: { id: propId, nickname: nick, typeId, contractor, seasonStart: startStr, addedBy: state.signedInAs || 'app' },
        jobs,
      }),
    });
    if (!r.ok) throw new Error('property POST ' + r.status);
    syncState.lastPushAt = Date.now();
    updateSyncIndicator();
  } catch (e) {
    console.warn('property sync failed', e);
    showToast(`${nick} saved on phone — sync will retry`);
    setTimeout(() => doAddPropertyRetry(propId, nick, typeId, contractor, startStr, jobs), 15000);
  }
}

  for (const k of Object.keys(crewObj)) if (crewObj[k] === undefined) delete crewObj[k];

      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ crew: { name, email, phone, notes, addedBy: state.signedInAs || 'app' } }),
    });
    if (!r.ok) throw new Error('crew POST ' + r.status);
    syncState.lastPushAt = Date.now();
    updateSyncIndicator();
  } catch (e) {
    console.warn('crew sync failed', e);
    showToast(`${name} saved on phone — sync will retry`);
    setTimeout(() => doAddCrewRetry(name, email, phone, notes), 15000);
  }
}

async function doAddCrewRetry(name, email, phone, notes) {
  if (!SYNC_BASE) return;
  try {
    const r = await fetch(SYNC_BASE + '/api/crew', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ crew: { name, email, phone, notes, addedBy: state.signedInAs || 'app' } }),
    });
    if (r.ok) { syncState.lastPushAt = Date.now(); updateSyncIndicator(); }
    else setTimeout(() => doAddCrewRetry(name, email, phone, notes), 30000);
  } catch {
    setTimeout(() => doAddCrewRetry(name, email, phone, notes), 30000);
  }
}

function notifyOffice(job) {
  const u = state.jobUpdates[job.JobID] || {};
  const status = effectiveStatus(job);
  const lines = [];
  lines.push(`Property: ${job.PropertyNickname || '?'} (${effectiveType(job) || ''})`);
  lines.push(`Job: ${job.JobID} · session ${job.SessionNumber ?? '?'}`);
  lines.push(`Crew: ${effectiveContractor(job) || state.signedInAs || ''}`);
  lines.push(`Scheduled: ${shortDate(effectiveDate(job))}`);
  let statusLine = 'Status: pending';
  if (status === 'Done') statusLine = `Status: DONE${u.finishedAt ? ' at ' + new Date(u.finishedAt).toLocaleString() : ''}`;
  else if (status === 'InProgress') statusLine = `Status: in progress (started ${u.startedAt ? new Date(u.startedAt).toLocaleString() : 'just now'})`;
  else if (status === 'OnWay') statusLine = `Status: on the way (${u.onMyWayAt ? new Date(u.onMyWayAt).toLocaleString() : 'just now'})`;
  else if (status === 'Cancelled') statusLine = 'Status: CANCELLED';
  lines.push(statusLine);
  const photoCount = (u.photos || []).length;
  if (photoCount) lines.push(`Photos taken this visit: ${photoCount} (saved on phone)`);
  if (u.notes) lines.push(`\nCrew note:\n${u.notes}`);
  if (u.finishedLat && u.finishedLng) lines.push(`\nFinish location: https://maps.google.com/?q=${u.finishedLat},${u.finishedLng}`);
  lines.push(`\n— Sent from Old Well Mowing app`);
  const subject = `[${job.JobID}] ${job.PropertyNickname || '?'} · ${status === 'Done' ? 'DONE' : status === 'InProgress' ? 'Started' : status === 'OnWay' ? 'On the way' : status === 'Cancelled' ? 'Cancelled' : 'Update'}`;
  const body = lines.join('\n');
  const mailto = `mailto:${encodeURIComponent(OFFICE_EMAIL)}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
  window.location.href = mailto;
}

/* ===== Office: Properties ===== */
function computeProperties() {
  const today = startOfToday();
  const map = new Map();
  for (const j of activeJobs()) {
    const k = j.PropertyID || j.PropertyNickname || '?';
    if (!map.has(k)) map.set(k, {
      id: k, propertyId: j.PropertyID, nickname: j.PropertyNickname, type: effectiveType(j),
      contractor: effectiveContractor(j),
      lastDone: null, lastDoneJob: null, nextPending: null, nextPendingJob: null,
      done7: 0, total: 0
    });
    const p = map.get(k);
    p.total++;
    const d = dayStart(effectiveDate(j));
    const status = effectiveStatus(j);
    if (status === 'Done') {
      if (!p.lastDone || d > p.lastDone) { p.lastDone = d; p.lastDoneJob = j; }
      if (daysBetween(today, d) <= 7 && d <= today) p.done7++;
    } else if (status !== 'Cancelled') {
      if (d >= today && (!p.nextPending || d < p.nextPending)) { p.nextPending = d; p.nextPendingJob = j; }
    }
  }
  return Array.from(map.values());
}
function ageBucket(days, type) {
  if (days === null || days === undefined) return { cls: 'never', label: 'Never' };
  let aging = 14, stale = 21;
  if (type === 'LUX') { aging = 10; stale = 14; }
  else if (type === 'VAC2') { aging = 35; stale = 50; }
  if (days >= stale) return { cls: 'stale', label: days + 'd' };
  if (days >= aging) return { cls: 'aging', label: days + 'd' };
  if (days >= 7) return { cls: 'ok', label: days + 'd' };
  return { cls: 'fresh', label: days + 'd' };
}
function officePropertiesScreen() {
  const today = startOfToday();
  const props = computeProperties();
  const sortKey = officeUi.propertySort;
  props.sort((a, b) => {
    if (sortKey === 'overdue') {
      const ad = a.lastDone ? daysBetween(today, a.lastDone) : 9999;
      const bd = b.lastDone ? daysBetween(today, b.lastDone) : 9999;
      return bd - ad;
    } else if (sortKey === 'next') {
      const an = a.nextPending ? +a.nextPending : Infinity;
      const bn = b.nextPending ? +b.nextPending : Infinity;
      return an - bn;
    } else if (sortKey === 'name') {
      return (a.nickname || '').localeCompare(b.nickname || '');
    } else if (sortKey === 'contractor') {
      return (a.contractor || '').localeCompare(b.contractor || '');
    }
    return 0;
  });

  const rows = props.map(p => {
    const lastDays = p.lastDone ? daysBetween(today, p.lastDone) : null;
    const bucket = ageBucket(lastDays, p.type);
    const lastPhoto = firstRenderableAttachment(p.lastDoneJob);
    const nextText = p.nextPending ? shortDate(p.nextPending) : '—';
    return `
      <button class="prop-row" data-property="${escAttr(p.id)}">
        ${lastPhoto ? `<img class="thumb" src="${escAttr(lastPhoto.ServerRelativeUrl)}" alt="">` : `<div class="thumb-empty">${iconSvg('leaf', 22)}</div>`}
        <div class="body">
          <div class="nick">${esc(p.nickname || '?')}</div>
          <div class="meta1">
            <span class="chip ${esc(p.type || '')}">${esc(p.type || '?')}</span>
            <span class="by">${esc(p.contractor || '')}</span>
          </div>
          <div class="stats">
            <span class="age-chip ${bucket.cls}">${esc(bucket.label)} since</span>
            <span class="next-due">Next ${esc(nextText)}</span>
          </div>
        </div>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--text-muted)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>

  return `

      <h2>${props.length} ${props.length === 1 ? 'property' : 'properties'}</h2>
      <div class="subtitle">${esc(propertiesSubtitle(props, today))}</div>
    </div>
    <div class="sort-row">
      <span class="count">Sorted by</span>
      <select id="prop-sort">
        <option value="overdue" ${sortKey==='overdue'?'selected':''}>Most overdue</option>
        <option value="next" ${sortKey==='next'?'selected':''}>Next due</option>
        <option value="name" ${sortKey==='name'?'selected':''}>Name (A–Z)</option>
        <option value="contractor" ${sortKey==='contractor'?'selected':''}>Contractor</option>
      </select>
    </div>
    <div class="stops">${rows}</div>
    <button class="fab" id="new-property-fab">${iconSvg('plus', 18)} Add property</button>

/* ===== Activity feed synthesis ===== */
function recentActivityEvents(daysBack) {
  const today = startOfToday();
  const cutoff = addDays(today, -daysBack);
  const events = [];
  for (const j of activeJobs()) {
    const u = state.jobUpdates[j.JobID];
    const contractor = effectiveContractor(j) || 'A crew';
    const property = j.PropertyNickname || '?';
    // From localStorage updates
    if (u?.finishedAt && new Date(u.finishedAt) >= cutoff) {
      const photoCount = (u.photos || []).length;
      const photoUrl = u.photos?.[0] ? crewPhotoSrc(u.photos[0]) : null;
      events.push({ kind: 'done', at: new Date(u.finishedAt), contractor, property, verb: 'finished', timeText: timeAgo(u.finishedAt), photoCount, photoUrl, jobId: j.JobID });
    } else if (u?.startedAt && new Date(u.startedAt) >= cutoff) {
      events.push({ kind: 'start', at: new Date(u.startedAt), contractor, property, verb: 'started', timeText: timeAgo(u.startedAt), jobId: j.JobID });
    } else if (u?.onMyWayAt && new Date(u.onMyWayAt) >= cutoff) {
      events.push({ kind: 'way', at: new Date(u.onMyWayAt), contractor, property, verb: 'is on the way to', timeText: timeAgo(u.onMyWayAt), jobId: j.JobID });
    }
    // From server data: Done jobs in window without an override
    else if (j.Status === 'Done') {
      const d = effectiveDate(j);
      if (d >= cutoff && d <= today) {
        const renderable = renderableServerAttachments(j);
        const photoUrl = renderable[0]?.ServerRelativeUrl;
        events.push({ kind: 'done', at: d, contractor, property, verb: 'finished', timeText: shortDate(d), photoCount: renderable.length, photoUrl, jobId: j.JobID });
      }
    }
  }
  // Late warnings as a synthetic event
  for (const j of activeJobs()) {
    if (effectiveStatus(j) === 'Done') continue;
    const d = effectiveDate(j);
    const diff = daysBetween(d, today);
    if (diff < -2 && diff >= -10) {
      events.push({
        kind: 'late', at: d,
        contractor: effectiveContractor(j) || '?',
        property: j.PropertyNickname || '?',
        verb: 'is overdue at',
        timeText: Math.abs(diff) + ' days late',
        jobId: j.JobID
      });
    }
  }
  events.sort((a,b) => b.at - a.at);
  return events;
}

/* ===== Photos collation ===== */
function recentPhotos(daysBack) {
  const today = startOfToday();
  const cutoff = addDays(today, -daysBack);
  const out = [];
  for (const j of activeJobs()) {
    const date = effectiveDate(j);
    const u = state.jobUpdates[j.JobID];
    // Server attachments
    for (const a of (j.Attachments || [])) {
      if (isRenderablePhoto(a.FileName)) {
        const visitDate = u?.finishedAt ? new Date(u.finishedAt) : date;
        if (visitDate >= cutoff && visitDate <= addDays(today, 1)) {
          out.push({ url: a.ServerRelativeUrl, propertyName: j.PropertyNickname || '?', when: visitDate, whenLabel: relativeWhen(visitDate), jobId: j.JobID });
        }
      }
    }
    // Local crew photos
    for (const p of (u?.photos || [])) {
      const visitDate = new Date(p.takenAt || u.finishedAt || date);
      if (visitDate >= cutoff && visitDate <= addDays(today, 1)) {
        const src = crewPhotoSrc(p);
        if (src) out.push({ url: src, propertyName: j.PropertyNickname || '?', when: visitDate, whenLabel: relativeWhen(visitDate), jobId: j.JobID });
      }
    }
  }
  out.sort((a,b) => b.when - a.when);
  return out;
}
function relativeWhen(d) {
  const diff = daysBetween(d, startOfToday());
  if (diff === 0) return 'today';
  if (diff === -1) return 'yesterday';
  if (diff < 0 && diff >= -6) return Math.abs(diff) + 'd ago';
  return shortDate(d);
}

function lastVisitFor(job) {
  if (!data) return null;
  const today = startOfToday();
  const sameProp = activeJobs().filter(j => (j.PropertyID || j.PropertyNickname) === (job.PropertyID || job.PropertyNickname) && j.JobID !== job.JobID)
    .filter(j => {
      if (effectiveStatus(j) === 'Done') return true;
      const u = state.jobUpdates[j.JobID];
      return u?.finishedAt;
    })
    .sort((a, b) => {
      const da = (state.jobUpdates[a.JobID]?.finishedAt) ? new Date(state.jobUpdates[a.JobID].finishedAt) : effectiveDate(a);
      const db = (state.jobUpdates[b.JobID]?.finishedAt) ? new Date(state.jobUpdates[b.JobID].finishedAt) : effectiveDate(b);
      return db - da;
    });
  if (!sameProp.length) return null;
  const lv = sameProp[0];
  const photo = firstRenderableAttachment(lv);
  const lvDate = state.jobUpdates[lv.JobID]?.finishedAt || lv.ScheduledDate;
  return { date: lvDate, photoUrl: photo ? photo.ServerRelativeUrl : null, daysAgo: Math.max(0, daysBetween(today, parseDate(lvDate))) };
}

function fileToResizedDataUrl(file, maxDim = 1280) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = reject;
    reader.onload = () => {
      const img = new Image();
      img.onload = () => {
        let { width, height } = img;
        if (width > maxDim || height > maxDim) {
          const r = Math.min(maxDim / width, maxDim / height);
          width = Math.round(width * r); height = Math.round(height * r);
        }
        const canvas = document.createElement('canvas');
        canvas.width = width; canvas.height = height;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL('image/jpeg', 0.82));
      };
      img.onerror = reject;
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

function esc(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function escAttr(s) { return String(s ?? '').replace(/'/g, '&#39;').replace(/"/g, '&quot;'); }

// Browsers (Chrome/Edge/Firefox) can't render HEIC. Filter to what'll actually show.
function isRenderablePhoto(filename) { return /\.(jpe?g|png|webp|gif)$/i.test(filename || ''); }
function renderableServerAttachments(job) {
  return (job?.Attachments || []).filter(a => isRenderablePhoto(a.FileName));
}
function firstRenderableAttachment(job) { return renderableServerAttachments(job)[0] || null; }
// Crew photos can have either a local dataUrl (just captured), a synced cloud url, or both.
function crewPhotoSrc(p) { return p?.url || p?.dataUrl || ''; }

  const onScroll = () => tb.classList.toggle('scrolled', window.scrollY > 8);
  if (window._scrollH) window.removeEventListener('scroll', window._scrollH);
  window._scrollH = onScroll;
  window.addEventListener('scroll', onScroll, { passive: true });
  onScroll();
}

function iconSvg(name, size = 22) {
  const stroke = 'currentColor';
  const sw = name === 'home' || name === 'grid' ? 2 : 2;
  if (name === 'logout') return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="${stroke}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>`;
  if (name === 'back') return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="${stroke}" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>`;
  if (name === 'home') return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="${stroke}" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12L12 3l9 9"/><path d="M5 10v10a1 1 0 0 0 1 1h3v-6h6v6h3a1 1 0 0 0 1-1V10"/></svg>`;
  if (name === 'calendar') return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="${stroke}" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>`;
  if (name === 'grid') return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="${stroke}" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>`;
  if (name === 'camera') return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="${stroke}" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>`;
  if (name === 'plus') return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="${stroke}" stroke-width="2.6" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>`;
  if (name === 'leaf') return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="${stroke}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10Z"/><path d="M2 21c0-3 1.85-5.36 5.08-6"/></svg>`;
  return '';
}

function errorScreen(msg) {
  return `<div class="center-state" style="min-height:100dvh;">
    <div class="glyph" style="background:var(--red-soft); color:var(--red);">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
    </div>
    <h3>Couldn't load schedule</h3>
    <p>${esc(msg)}</p>
  </div>`;
}

init();
</script>
</body>
