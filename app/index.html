<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1b4332">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<title>Old Well Field</title>
<style>
:root {
  --bg: #faf8f2;
  --surface: #ffffff;
  --surface-2: #f3f1e9;
  --border: #e6e3d8;
  --border-strong: #d3cfc1;
  --text: #1b2316;
  --text-soft: #555a4b;
  --text-muted: #8a8e7d;
  --green: #2d6a4f;
  --green-deep: #1b4332;
  --green-soft: #e6efe5;
  --green-pale: #f1f5ee;
  --amber: #b06f0f;
  --amber-soft: #faf0d8;
  --red: #9a3027;
  --red-soft: #f8e6e2;
  --blue: #2e4f7a;
  --blue-soft: #e2eaf3;
  --shadow-sm: 0 1px 2px rgba(27,35,22,.04);
  --shadow-md: 0 4px 14px rgba(27,35,22,.07);
  --shadow-lg: 0 12px 32px rgba(27,35,22,.10);
  color-scheme: light;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body {
  margin: 0; padding: 0;
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  font-size: 16px; line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  overscroll-behavior-y: none;
}
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: var(--green-deep); }

.app {
  max-width: 480px;
  margin: 0 auto;
  min-height: 100vh;
  min-height: 100dvh;
  background: var(--bg);
  display: flex; flex-direction: column;
  position: relative;
  overflow: hidden;
}

.topbar {
  position: sticky; top: 0; z-index: 30;
  background: var(--bg);
  padding: max(12px, env(safe-area-inset-top)) 16px 12px;
  display: flex; align-items: center; gap: 10px;
  border-bottom: 1px solid transparent;
  transition: border-color .2s, background .2s;
}
.topbar.scrolled {
  border-bottom-color: var(--border);
  background: rgba(250,248,242,.94);
  -webkit-backdrop-filter: blur(12px);
  backdrop-filter: blur(12px);
}
.topbar h1 { margin: 0; font-size: 17px; font-weight: 600; letter-spacing: -.01em; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.topbar .icon-btn { width: 38px; height: 38px; border-radius: 50%; border: none; background: transparent; display: inline-flex; align-items: center; justify-content: center; color: var(--text-soft); transition: background .15s, color .15s; }
.topbar .icon-btn:active { background: var(--surface-2); color: var(--text); }

.signin { flex: 1; display: flex; flex-direction: column; padding: 24px 20px 40px; }
.signin .hero { margin-top: 28px; margin-bottom: 26px; }
.signin .badge {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 5px 12px; background: var(--green-soft); color: var(--green-deep);
  border-radius: 999px; font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase;
}
.signin h1 { margin: 16px 0 6px; font-size: 32px; font-weight: 700; line-height: 1.15; letter-spacing: -.02em; }
.signin .lede { color: var(--text-soft); font-size: 16px; }
.crew-list { display: flex; flex-direction: column; gap: 10px; }
.crew-card {
  width: 100%; text-align: left; padding: 14px 16px;
  background: var(--surface); border: 1px solid var(--border); border-radius: 14px;
  display: flex; align-items: center; gap: 14px;
  transition: transform .12s, box-shadow .15s, border-color .15s;
}
.crew-card:active { transform: scale(.985); border-color: var(--green); box-shadow: var(--shadow-md); }
.avatar {
  width: 44px; height: 44px; border-radius: 50%;
  background: var(--green-pale); color: var(--green-deep);
  display: inline-flex; align-items: center; justify-content: center;
  font-weight: 700; font-size: 15px; letter-spacing: .02em;
  border: 1px solid var(--green-soft);
  flex-shrink: 0;
}
.crew-card .name { font-weight: 600; font-size: 16px; line-height: 1.25; }
.crew-card .meta { font-size: 13px; color: var(--text-muted); margin-top: 2px; }
.crew-card .grow { flex: 1; min-width: 0; }
.crew-card .chev { color: var(--text-muted); margin-left: 8px; flex-shrink: 0; }
.crew-card.office .avatar { background: var(--surface-2); color: var(--text-soft); border-color: var(--border); }
.signin .demo-note {
  margin-top: 28px; padding: 12px 14px; background: var(--surface-2);
  border-radius: 10px; font-size: 12px; color: var(--text-soft); line-height: 1.5;
}
.signin .demo-note button {
  background: none; border: none; color: var(--green-deep); padding: 0; font-weight: 600; text-decoration: underline;
}

.day-header { padding: 4px 20px 16px; }
.day-header .date { color: var(--text-muted); font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; }
.day-header h2 { margin: 4px 0 0; font-size: 28px; font-weight: 700; letter-spacing: -.02em; }
.day-header .subtitle { margin-top: 6px; color: var(--text-soft); font-size: 15px; }

.section-label { padding: 14px 20px 8px; color: var(--text-muted); font-size: 11px; font-weight: 700; letter-spacing: .09em; text-transform: uppercase; }
.section-label .count { color: var(--text-muted); font-weight: 600; }

.stops { display: flex; flex-direction: column; gap: 10px; padding: 0 16px; }
.stops + .section-label { padding-top: 24px; }

.stop {
  background: var(--surface); border: 1px solid var(--border); border-radius: 14px;
  padding: 14px 16px;
  display: flex; flex-direction: column; gap: 8px;
  text-align: left; width: 100%;
  transition: transform .12s, border-color .15s, box-shadow .15s;
  position: relative;
}
.stop:active { transform: scale(.99); border-color: var(--border-strong); }
.stop.done { background: var(--green-pale); border-color: var(--green-soft); }
.stop.late { border-left: 3px solid var(--red); padding-left: 13px; }
.stop.way   { border-left: 3px solid var(--amber); padding-left: 13px; }
.stop.start { border-left: 3px solid var(--blue); padding-left: 13px; }
.stop .row1 { display: flex; align-items: flex-start; gap: 10px; }
.stop .nick { font-weight: 700; font-size: 17px; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.stop .when { color: var(--text-muted); font-size: 13px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.stop .row2 { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.stop .contractor { color: var(--text-soft); font-size: 13px; }
.stop .photo-count { color: var(--text-muted); font-size: 12px; display: inline-flex; align-items: center; gap: 3px; }

.empty-card {
  text-align: center; padding: 28px 20px;
  background: var(--surface); border: 1px dashed var(--border-strong); border-radius: 14px;
  color: var(--text-muted); font-size: 14px;
}

.chip {
  display: inline-flex; align-items: center;
  padding: 3px 9px; border-radius: 6px;
  font-size: 11px; font-weight: 700; letter-spacing: .04em;
  background: var(--surface-2); color: var(--text-soft);
}
.chip.LUX { background: #f4ecd8; color: #6e4d10; }
.chip.VAC1 { background: var(--blue-soft); color: var(--blue); }
.chip.VAC2 { background: #e7e7f1; color: #3b3768; }
.chip.RNT { background: #ece5f1; color: #553772; }

.status {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 3px 10px; border-radius: 999px; font-size: 12px; font-weight: 600;
}
.status.done { background: var(--green-soft); color: var(--green-deep); }
.status.way { background: var(--amber-soft); color: var(--amber); }
.status.start { background: var(--blue-soft); color: var(--blue); }
.status.late { background: var(--red-soft); color: var(--red); }
.status .dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }

.job { flex: 1; display: flex; flex-direction: column; padding-bottom: 140px; }
.job-hero { padding: 0 20px 20px; }
.job-hero .meta { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.job-hero .scheduled { color: var(--text-soft); font-size: 14px; }
.job-hero .nick { font-size: 30px; font-weight: 800; letter-spacing: -.02em; margin: 6px 0 0; line-height: 1.1; }
.job-hero .by { margin-top: 6px; color: var(--text-soft); font-size: 14px; }
.job-hero .live-status { margin-top: 10px; }

.panel {
  background: var(--surface); border: 1px solid var(--border); border-radius: 14px;
  margin: 0 16px 10px; padding: 14px 16px;
}
.panel h3 { margin: 0 0 8px; font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--text-muted); }
.panel .last-photo {
  width: 100%; aspect-ratio: 4/3; object-fit: cover; border-radius: 10px; margin-top: 4px; display: block; background: var(--surface-2); cursor: zoom-in;
}
.panel .last-meta { margin-top: 6px; font-size: 13px; color: var(--text-soft); }
.panel .empty { color: var(--text-muted); font-size: 14px; padding: 6px 0; }

textarea.notes {
  width: 100%; min-height: 84px;
  background: var(--bg); border: 1px solid var(--border); border-radius: 10px;
  padding: 12px; color: var(--text); resize: vertical;
  transition: border-color .15s, box-shadow .15s, background .15s;
  font-size: 15px;
}
textarea.notes:focus { outline: none; border-color: var(--green); background: #fff; box-shadow: 0 0 0 3px var(--green-soft); }

.photo-strip {
  display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 4px;
}
.photo-tile {
  aspect-ratio: 1; border-radius: 8px; overflow: hidden; background: var(--surface-2);
  border: 1px solid var(--border); position: relative; cursor: zoom-in;
}
.photo-tile img { width: 100%; height: 100%; object-fit: cover; display: block; }
.photo-tile .rm {
  position: absolute; top: 4px; right: 4px; width: 22px; height: 22px; border-radius: 50%;
  background: rgba(0,0,0,.55); color: #fff; border: none; display: flex; align-items: center; justify-content: center; font-size: 13px; line-height: 1;
}
.photo-add {
  aspect-ratio: 1; border-radius: 8px; border: 1.5px dashed var(--border-strong);
  background: var(--bg); color: var(--text-muted);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
  font-size: 11px; font-weight: 600;
  cursor: pointer; transition: border-color .15s, color .15s, background .15s;
}
.photo-add .plus { font-size: 22px; line-height: 1; }
.photo-add:active { border-color: var(--green); color: var(--green-deep); background: var(--green-pale); }

.action-bar {
  position: fixed; bottom: 0; left: 0; right: 0;
  z-index: 40;
  padding: 16px 16px calc(14px + env(safe-area-inset-bottom));
  background: linear-gradient(180deg, rgba(250,248,242,0) 0%, var(--bg) 36%);
  pointer-events: none;
}
.action-bar .inner {
  max-width: 480px; margin: 0 auto;
  display: flex; flex-direction: column; gap: 8px;
  pointer-events: auto;
}
.action-bar .row { display: flex; gap: 8px; }
.btn {
  flex: 1;
  padding: 0 18px; border-radius: 12px; border: 1px solid var(--border);
  font-size: 16px; font-weight: 600; letter-spacing: -.01em;
  background: var(--surface); color: var(--text);
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  transition: transform .1s, background .15s, border-color .15s, opacity .15s;
  min-height: 52px;
}
.btn:active { transform: scale(.985); }
.btn.primary { background: var(--green); color: #fff; border-color: var(--green); box-shadow: 0 6px 16px rgba(45,106,79,.22); }
.btn.primary:active { background: var(--green-deep); }
.btn.amber { background: var(--amber); color: #fff; border-color: var(--amber); box-shadow: 0 6px 16px rgba(176,111,15,.22); }
.btn.ghost { background: transparent; border-color: transparent; color: var(--text-soft); }
.btn:disabled { opacity: .55; pointer-events: none; }

.toast {
  position: fixed; left: 50%; bottom: calc(120px + env(safe-area-inset-bottom));
  transform: translateX(-50%) translateY(20px);
  background: var(--text); color: var(--bg);
  padding: 11px 18px; border-radius: 999px; font-size: 14px; font-weight: 500;
  box-shadow: var(--shadow-lg); opacity: 0; transition: opacity .2s, transform .2s;
  z-index: 60; pointer-events: none;
  max-width: 90%;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

.center-state {
  flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
  padding: 56px 32px; text-align: center; color: var(--text-soft);
}
.center-state .glyph {
  width: 56px; height: 56px; border-radius: 50%; background: var(--green-pale);
  display: inline-flex; align-items: center; justify-content: center; margin-bottom: 14px;
  color: var(--green-deep);
}
.center-state h3 { margin: 0 0 6px; font-size: 18px; color: var(--text); font-weight: 600; }
.center-state p { margin: 0; font-size: 14px; max-width: 280px; }

.lightbox {
  position: fixed; inset: 0; z-index: 100;
  background: rgba(10,14,8,.94);
  display: none; align-items: center; justify-content: center;
  padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
}
.lightbox.show { display: flex; }
.lightbox img { max-width: 96vw; max-height: 86vh; border-radius: 8px; box-shadow: 0 8px 40px rgba(0,0,0,.5); }
.lightbox .close { position: absolute; top: max(16px, env(safe-area-inset-top)); right: 16px; background: rgba(255,255,255,.15); color: #fff; border: none; width: 40px; height: 40px; border-radius: 50%; font-size: 22px; }

.skel { background: linear-gradient(90deg, var(--surface-2), #eae8de, var(--surface-2)); background-size: 200% 100%; animation: shimmer 1.4s infinite; border-radius: 8px; }
@keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }

.fade-in { animation: fadeIn .25s ease-out; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }

@media (min-width: 600px) {
  body { padding: 18px 0; background: #ecebe3; }
  .app { box-shadow: var(--shadow-lg); border-radius: 22px; min-height: calc(100dvh - 36px); }
}
</style>
</head>
<body>
<div class="app" id="app">
  <div class="center-state" style="min-height: 100dvh;">
    <div class="glyph">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10Z"/><path d="M2 21c0-3 1.85-5.36 5.08-6"/></svg>
    </div>
    <h3>Loading…</h3>
  </div>
</div>
<div class="toast" id="toast"></div>
<div class="lightbox" id="lightbox" onclick="closeLightbox()">
  <button class="close" onclick="event.stopPropagation(); closeLightbox()">×</button>
  <img id="lightbox-img" src="" alt="">
</div>

<script>
const DATA_URL = '../data.json';
const STATE_KEY = 'oldwell-field-v1';
const WEEK_LOOKAHEAD = 7;
const UPCOMING_LOOKAHEAD = 21;

let state = loadState();
let data = null;

function loadState() {
  try { return JSON.parse(localStorage.getItem(STATE_KEY)) || { signedInAs: null, jobUpdates: {} }; }
  catch { return { signedInAs: null, jobUpdates: {} }; }
}
function saveState() { localStorage.setItem(STATE_KEY, JSON.stringify(state)); }
function jobUpdate(jobId) { if (!state.jobUpdates[jobId]) state.jobUpdates[jobId] = {}; return state.jobUpdates[jobId]; }
function effectiveStatus(job) {
  const u = state.jobUpdates[job.JobID];
  if (u?.status) return u.status;
  return job.Status === 'Done' ? 'Done' : 'Pending';
}

function parseDate(iso) { return new Date(iso); }
function startOfToday() { const d = new Date(); d.setHours(0,0,0,0); return d; }
function isSameDay(a, b) { return a.getFullYear()===b.getFullYear() && a.getMonth()===b.getMonth() && a.getDate()===b.getDate(); }
function dayStart(d) { const n = new Date(d); n.setHours(0,0,0,0); return n; }
function daysBetween(a, b) { return Math.round((dayStart(a) - dayStart(b)) / 86400000); }
function shortDate(d) { return d.toLocaleDateString('en-US', {month:'short', day:'numeric'}); }
function dayLabel(d) {
  const diff = daysBetween(d, startOfToday());
  if (diff === 0) return 'Today';
  if (diff === 1) return 'Tomorrow';
  if (diff === -1) return 'Yesterday';
  if (diff > 1 && diff <= 6) return d.toLocaleDateString('en-US', {weekday:'long'});
  return d.toLocaleDateString('en-US', {weekday:'short', month:'short', day:'numeric'});
}
function timeAgo(iso) {
  const m = Math.round((Date.now() - new Date(iso).getTime()) / 60000);
  if (m < 1) return 'just now';
  if (m < 60) return m + ' min ago';
  const h = Math.round(m / 60);
  if (h < 24) return h + 'h ago';
  return new Date(iso).toLocaleDateString('en-US', {month:'short', day:'numeric'});
}

async function init() {
  try {
    const r = await fetch(DATA_URL + '?t=' + Date.now(), { cache: 'no-store' });
    if (!r.ok) throw new Error('Schedule unavailable (' + r.status + ')');
    data = await r.json();
  } catch (e) {
    document.getElementById('app').innerHTML = errorScreen(e.message);
    return;
  }
  window.addEventListener('hashchange', render);
  render();
}

function render() {
  const app = document.getElementById('app');
  if (!state.signedInAs) { app.innerHTML = signInScreen(); attachSignInHandlers(); attachScrollHandler(); return; }
  const route = parseRoute();
  if (route.name === 'job') { app.innerHTML = jobScreen(route.id); attachJobHandlers(route.id); }
  else { app.innerHTML = dayScreen(); attachDayHandlers(); }
  attachScrollHandler();
  window.scrollTo(0, 0);
}

function parseRoute() {
  const h = location.hash.replace(/^#\/?/, '');
  if (h.startsWith('job/')) return { name: 'job', id: decodeURIComponent(h.substring(4)) };
  return { name: 'day' };
}
function go(path) { location.hash = path; }

function signInScreen() {
  const contractors = uniqueContractors();
  const cards = contractors.map(c => `
    <button class="crew-card" data-contractor="${escAttr(c)}">
      <span class="avatar">${initials(c)}</span>
      <div class="grow">
        <div class="name">${esc(c)}</div>
        <div class="meta">${countJobsThisWeek(c)} this week</div>
      </div>
      <svg class="chev" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
    </button>
  `).join('');
  return `
    <div class="signin fade-in">
      <div class="hero">
        <span class="badge">Old Well · Mowing</span>
        <h1>Who's mowing today?</h1>
        <div class="lede">Pick your crew to see your stops for the week.</div>
      </div>
      <div class="crew-list">
        ${cards}
        <button class="crew-card office" data-contractor="OFFICE_ALL">
          <span class="avatar">ALL</span>
          <div class="grow">
            <div class="name">Office view</div>
            <div class="meta">See every crew's day</div>
          </div>
          <svg class="chev" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
        </button>
      </div>
      <div class="demo-note">
        <strong>Preview build.</strong> Changes (start/finish, photos, notes) save to this device only — nothing syncs back to SharePoint yet. <button onclick="resetDemo()">Reset demo</button>
      </div>
    </div>
  `;
}

function attachSignInHandlers() {
  document.querySelectorAll('.crew-card').forEach(el => {
    el.addEventListener('click', () => {
      state.signedInAs = el.dataset.contractor;
      saveState();
      location.hash = '/';
      render();
    });
  });
}

function bucketJobs(jobs) {
  const today = startOfToday();
  const todayB = [], completedToday = [], thisWeek = [], upcoming = [];
  for (const j of jobs) {
    const date = parseDate(j.ScheduledDate);
    const diff = daysBetween(date, today);
    const u = state.jobUpdates[j.JobID];
    const finishedToday = u?.finishedAt && isSameDay(new Date(u.finishedAt), today);
    const status = effectiveStatus(j);
    const item = Object.assign({}, j, { _date: date, _diff: diff });
    if (finishedToday) { completedToday.push(item); continue; }
    if (status === 'Done') continue;
    if (diff <= 0) todayB.push(item);
    else if (diff <= WEEK_LOOKAHEAD) thisWeek.push(item);
    else if (diff <= UPCOMING_LOOKAHEAD) upcoming.push(item);
  }
  todayB.sort((a,b) => a._date - b._date);
  thisWeek.sort((a,b) => a._date - b._date);
  upcoming.sort((a,b) => a._date - b._date);
  completedToday.sort((a,b) => new Date((state.jobUpdates[b.JobID]||{}).finishedAt||0) - new Date((state.jobUpdates[a.JobID]||{}).finishedAt||0));
  return { today: todayB, completedToday, thisWeek, upcoming };
}

function dayScreen() {
  const jobs = jobsForCurrentUser();
  const { today: todayJobs, completedToday, thisWeek, upcoming } = bucketJobs(jobs);
  const totalUpcoming = todayJobs.length + completedToday.length + thisWeek.length + upcoming.length;

  let body = '';
  if (totalUpcoming === 0) {
    body = `
      <div class="center-state">
        <div class="glyph">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10Z"/><path d="M2 21c0-3 1.85-5.36 5.08-6"/></svg>
        </div>
        <h3>All caught up</h3>
        <p>Nothing on the schedule for the next three weeks.</p>
      </div>
    `;
  } else {
    body = `
      <div class="section-label">Today <span class="count">${todayJobs.length === 0 ? '· nothing scheduled' : '· ' + todayJobs.length + ' to go'}</span></div>
      <div class="stops">${todayJobs.length ? todayJobs.map(stopCard).join('') : '<div class="empty-card">No active stops for today.</div>'}</div>
      ${completedToday.length ? `
        <div class="section-label">Finished today <span class="count">· ${completedToday.length}</span></div>
        <div class="stops">${completedToday.map(stopCard).join('')}</div>
      ` : ''}
      ${thisWeek.length ? `
        <div class="section-label">This week <span class="count">· ${thisWeek.length}</span></div>
        <div class="stops">${thisWeek.map(stopCard).join('')}</div>
      ` : ''}
      ${upcoming.length ? `
        <div class="section-label">Coming up <span class="count">· next ${UPCOMING_LOOKAHEAD - WEEK_LOOKAHEAD} days</span></div>
        <div class="stops">${upcoming.slice(0,10).map(stopCard).join('')}</div>
      ` : ''}
    `;
  }

  return `
    <header class="topbar" id="topbar">
      <span class="avatar" style="width:34px; height:34px; font-size:13px;">${initials(state.signedInAs === 'OFFICE_ALL' ? 'Office' : state.signedInAs)}</span>
      <h1>${esc(displayName(state.signedInAs))}</h1>
      <button class="icon-btn" id="signout-btn" title="Sign out">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
      </button>
    </header>
    <div class="day-header fade-in">
      <div class="date">${new Date().toLocaleDateString('en-US', {weekday:'long', month:'long', day:'numeric'})}</div>
      <h2>${greetingFor(state.signedInAs)}</h2>
      <div class="subtitle">${dayHeaderSubtitle(todayJobs, completedToday, thisWeek)}</div>
    </div>
    <div style="padding-bottom: max(40px, env(safe-area-inset-bottom));">
      ${body}
    </div>
  `;
}

function dayHeaderSubtitle(today, done, week) {
  if (today.length === 0 && done.length === 0 && week.length === 0) return 'No stops on deck this week.';
  if (today.length === 0 && done.length === 0) return `No stops today — ${week.length} on deck this week.`;
  if (today.length === 0 && done.length > 0) return `All ${done.length} done — nice work.`;
  const late = today.filter(t => t._diff < 0).length;
  if (late > 0) return `${today.length} to go${done.length ? ` · ${done.length} done` : ''} · ${late} catch-up${late>1?'s':''}.`;
  return `${today.length} ${today.length===1?'stop':'stops'} to knock out${done.length ? ` · ${done.length} done` : ''}.`;
}

function attachDayHandlers() {
  document.querySelectorAll('.stop[data-job]').forEach(el => {
    el.addEventListener('click', () => go('/job/' + encodeURIComponent(el.dataset.job)));
  });
  const out = document.getElementById('signout-btn');
  if (out) out.addEventListener('click', () => {
    if (confirm('Sign out and switch crew?')) {
      state.signedInAs = null; saveState(); location.hash = '/'; render();
    }
  });
}

function stopCard(j) {
  const status = effectiveStatus(j);
  const u = state.jobUpdates[j.JobID] || {};
  const diff = j._diff;
  const photos = (u.photos || []).length;

  let whenText;
  if (diff === 0) whenText = 'Today';
  else if (diff === 1) whenText = 'Tomorrow';
  else if (diff < 0) whenText = Math.abs(diff) + 'd late';
  else if (diff <= 6) whenText = j._date.toLocaleDateString('en-US', {weekday: 'short'}) + ' ' + (j._date.getMonth()+1) + '/' + j._date.getDate();
  else whenText = (j._date.getMonth()+1) + '/' + j._date.getDate();

  let cardCls = '';
  let statusPill = '';
  if (status === 'Done') { cardCls = ' done'; statusPill = `<span class="status done"><span class="dot"></span>Done${u.finishedAt ? ' · ' + timeAgo(u.finishedAt) : ''}</span>`; }
  else if (status === 'InProgress') { cardCls = ' start'; statusPill = `<span class="status start"><span class="dot"></span>In progress</span>`; }
  else if (status === 'OnWay') { cardCls = ' way'; statusPill = `<span class="status way"><span class="dot"></span>On the way</span>`; }
  else if (diff < 0) { cardCls = ' late'; statusPill = `<span class="status late"><span class="dot"></span>${Math.abs(diff)}d late</span>`; }

  return `
    <button class="stop${cardCls}" data-job="${escAttr(j.JobID)}">
      <div class="row1">
        <div class="nick">${esc(j.PropertyNickname || '?')}</div>
        <div class="when">${esc(whenText)}</div>
      </div>
      <div class="row2">
        <span class="chip ${esc(j.TypeID || '')}">${esc(j.TypeID || '?')}</span>
        ${state.signedInAs === 'OFFICE_ALL' ? `<span class="contractor">${esc(j.ContractorName || '')}</span>` : ''}
        ${statusPill}
        ${photos > 0 ? `<span class="photo-count">📷 ${photos}</span>` : ''}
      </div>
    </button>
  `;
}

function jobScreen(jobId) {
  const job = (data.jobs || []).find(j => j.JobID === jobId);
  if (!job) return errorScreen('Job not found: ' + jobId);
  const u = jobUpdate(jobId);
  const status = effectiveStatus(job);
  const date = parseDate(job.ScheduledDate);

  const last = lastVisitFor(job);
  const photos = u.photos || [];
  const photoTiles = photos.map(p => `
    <div class="photo-tile" data-zoom="${escAttr(p.dataUrl)}">
      <img src="${escAttr(p.dataUrl)}" alt="">
      <button class="rm" data-rm="${escAttr(p.id)}" title="Remove">×</button>
    </div>
  `).join('');

  let liveStatus = '';
  if (u.finishedAt) liveStatus = `<span class="status done"><span class="dot"></span>Finished ${esc(timeAgo(u.finishedAt))}</span>`;
  else if (u.startedAt) liveStatus = `<span class="status start"><span class="dot"></span>Started ${esc(timeAgo(u.startedAt))}</span>`;
  else if (u.onMyWayAt) liveStatus = `<span class="status way"><span class="dot"></span>On the way · ${esc(timeAgo(u.onMyWayAt))}</span>`;

  let lastBlock;
  if (last && last.photoUrl) {
    lastBlock = `
      <h3>Last visit · ${esc(shortDate(parseDate(last.date)))}</h3>
      <img class="last-photo" src="${escAttr(last.photoUrl)}" data-zoom="${escAttr(last.photoUrl)}">
      <div class="last-meta">${esc(last.daysAgo)} days ago</div>
    `;
  } else if (last) {
    lastBlock = `
      <h3>Last visit · ${esc(shortDate(parseDate(last.date)))}</h3>
      <div class="empty">No photo on file. ${esc(last.daysAgo)} days ago.</div>
    `;
  } else {
    lastBlock = `<h3>Last visit</h3><div class="empty">No previous mow on record.</div>`;
  }

  return `
    <header class="topbar" id="topbar">
      <button class="icon-btn" id="back-btn">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
      </button>
      <h1>${esc(job.PropertyNickname || 'Job')}</h1>
    </header>
    <div class="job fade-in">
      <div class="job-hero">
        <div class="meta">
          <span class="chip ${esc(job.TypeID || '')}">${esc(job.TypeID || '?')}</span>
          <span class="scheduled">${esc(dayLabel(date))} · session ${job.SessionNumber ?? '?'}</span>
        </div>
        <div class="nick">${esc(job.PropertyNickname || '?')}</div>
        <div class="by">${esc(job.ContractorName || '')}</div>
        ${liveStatus ? `<div class="live-status">${liveStatus}</div>` : ''}
      </div>

      <div class="panel">${lastBlock}</div>

      <div class="panel">
        <h3>Photos this visit · ${photos.length}</h3>
        <div class="photo-strip">
          ${photoTiles}
          <label class="photo-add" for="photo-input">
            <span class="plus">+</span>
            <span>Add photo</span>
          </label>
        </div>
        <input id="photo-input" type="file" accept="image/*" capture="environment" multiple style="display:none">
      </div>

      <div class="panel">
        <h3>Notes to office</h3>
        <textarea class="notes" id="notes-input" placeholder="Anything to flag? Sprinkler heads, gates, tenant issues, weather…">${esc(u.notes || '')}</textarea>
      </div>
    </div>

    <div class="action-bar">
      <div class="inner">${renderActions(job, status)}</div>
    </div>
  `;
}

function renderActions(job, status) {
  const u = jobUpdate(job.JobID);
  if (status === 'Done') {
    return `<div class="row"><button class="btn ghost" data-act="undo">↶ Re-open job</button></div>`;
  }
  if (u.startedAt && !u.finishedAt) {
    return `<div class="row"><button class="btn primary" data-act="finish">✓ Finish job</button></div>`;
  }
  if (u.onMyWayAt && !u.startedAt) {
    return `<div class="row"><button class="btn primary" data-act="start">▶ Start working</button></div>`;
  }
  return `
    <div class="row">
      <button class="btn" data-act="onway">On my way</button>
      <button class="btn primary" data-act="start">▶ Start</button>
    </div>
  `;
}

function attachJobHandlers(jobId) {
  const back = document.getElementById('back-btn');
  if (back) back.addEventListener('click', () => go('/'));

  const notes = document.getElementById('notes-input');
  if (notes) {
    let saveTimer;
    notes.addEventListener('input', () => {
      clearTimeout(saveTimer);
      saveTimer = setTimeout(() => {
        const u = jobUpdate(jobId);
        u.notes = notes.value;
        saveState();
      }, 350);
    });
  }

  const photoInput = document.getElementById('photo-input');
  if (photoInput) photoInput.addEventListener('change', async (e) => {
    const files = Array.from(e.target.files || []);
    if (!files.length) return;
    let added = 0;
    for (const f of files) {
      try {
        const dataUrl = await fileToResizedDataUrl(f, 1280);
        const u = jobUpdate(jobId);
        if (!u.photos) u.photos = [];
        u.photos.push({ id: 'p_' + Date.now() + '_' + Math.random().toString(36).slice(2,7), dataUrl, takenAt: new Date().toISOString() });
        added++;
      } catch (err) { console.warn('photo error', err); }
    }
    saveState();
    e.target.value = '';
    render();
    if (added > 0) showToast(added + (added === 1 ? ' photo added' : ' photos added'));
  });

  document.querySelectorAll('[data-zoom]').forEach(el => {
    el.addEventListener('click', (ev) => {
      if (ev.target.matches('[data-rm]')) return;
      openLightbox(el.dataset.zoom);
    });
  });
  document.querySelectorAll('[data-rm]').forEach(btn => {
    btn.addEventListener('click', (ev) => {
      ev.stopPropagation();
      const id = btn.dataset.rm;
      const u = jobUpdate(jobId);
      u.photos = (u.photos || []).filter(p => p.id !== id);
      saveState(); render();
    });
  });

  document.querySelectorAll('[data-act]').forEach(btn => {
    btn.addEventListener('click', async () => {
      const act = btn.dataset.act;
      const u = jobUpdate(jobId);
      const now = new Date().toISOString();
      if (act === 'onway') {
        u.onMyWayAt = now; u.status = 'OnWay'; saveState();
        showToast('Marked on the way'); render();
      } else if (act === 'start') {
        u.startedAt = now;
        if (!u.onMyWayAt) u.onMyWayAt = now;
        u.status = 'InProgress'; saveState();
        showToast('Job started'); render();
      } else if (act === 'finish') {
        u.finishedAt = now;
        u.status = 'Done';
        saveState();
        if (navigator.geolocation) {
          navigator.geolocation.getCurrentPosition(
            pos => { u.finishedLat = pos.coords.latitude; u.finishedLng = pos.coords.longitude; u.finishedAccuracy = pos.coords.accuracy; saveState(); },
            () => {},
            { timeout: 6000, maximumAge: 60000, enableHighAccuracy: false }
          );
        }
        showToast('Job complete'); render();
      } else if (act === 'undo') {
        delete u.status; delete u.finishedAt; delete u.startedAt; delete u.onMyWayAt;
        delete u.finishedLat; delete u.finishedLng; delete u.finishedAccuracy;
        saveState(); showToast('Re-opened'); render();
      }
    });
  });
}

function jobsForCurrentUser() {
  const all = data.jobs || [];
  if (state.signedInAs === 'OFFICE_ALL') return all;
  return all.filter(j => j.ContractorName === state.signedInAs);
}
function uniqueContractors() {
  const set = new Set();
  for (const j of (data?.jobs || [])) if (j.ContractorName) set.add(j.ContractorName);
  return Array.from(set).sort();
}
function countJobsThisWeek(c) {
  const today = startOfToday();
  const end = new Date(today); end.setDate(end.getDate() + 7);
  return (data?.jobs || []).filter(j => {
    if (j.ContractorName !== c) return false;
    const d = parseDate(j.ScheduledDate);
    return d >= today && d <= end;
  }).length;
}
function lastVisitFor(job) {
  if (!data) return null;
  const today = startOfToday();
  const sameProp = data.jobs.filter(j => j.PropertyID === job.PropertyID && j.JobID !== job.JobID)
    .filter(j => {
      if (effectiveStatus(j) === 'Done') return true;
      const u = state.jobUpdates[j.JobID];
      return u?.finishedAt;
    })
    .sort((a, b) => {
      const da = (state.jobUpdates[a.JobID]?.finishedAt) ? new Date(state.jobUpdates[a.JobID].finishedAt) : parseDate(a.ScheduledDate);
      const db = (state.jobUpdates[b.JobID]?.finishedAt) ? new Date(state.jobUpdates[b.JobID].finishedAt) : parseDate(b.ScheduledDate);
      return db - da;
    });
  if (!sameProp.length) return null;
  const lv = sameProp[0];
  const photo = (lv.Attachments || [])[0];
  const lvDate = state.jobUpdates[lv.JobID]?.finishedAt || lv.ScheduledDate;
  return { date: lvDate, photoUrl: photo ? photo.ServerRelativeUrl : null, daysAgo: Math.max(0, daysBetween(today, parseDate(lvDate))) };
}
function initials(name) {
  if (!name) return '?';
  return name.replace(/\s+/g, ' ').trim().split(' ').map(s => s[0]).filter(Boolean).slice(0, 2).join('').toUpperCase();
}
function displayName(c) { return c === 'OFFICE_ALL' ? 'Office view' : c; }
function greetingFor(c) {
  const h = new Date().getHours();
  const g = h < 12 ? 'Good morning' : h < 17 ? 'Good afternoon' : 'Good evening';
  return `${g}, ${c === 'OFFICE_ALL' ? 'Office' : firstName(c)}`;
}
function firstName(c) { return c?.split(/\s+/)[0] || ''; }

function fileToResizedDataUrl(file, maxDim = 1280) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = reject;
    reader.onload = () => {
      const img = new Image();
      img.onload = () => {
        let { width, height } = img;
        if (width > maxDim || height > maxDim) {
          const r = Math.min(maxDim / width, maxDim / height);
          width = Math.round(width * r); height = Math.round(height * r);
        }
        const canvas = document.createElement('canvas');
        canvas.width = width; canvas.height = height;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL('image/jpeg', 0.82));
      };
      img.onerror = reject;
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

function esc(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function escAttr(s) { return String(s ?? '').replace(/'/g, '&#39;').replace(/"/g, '&quot;'); }

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(window._toastT);
  window._toastT = setTimeout(() => t.classList.remove('show'), 2200);
}
function openLightbox(src) {
  document.getElementById('lightbox-img').src = src;
  document.getElementById('lightbox').classList.add('show');
}
function closeLightbox() {
  document.getElementById('lightbox').classList.remove('show');
  document.getElementById('lightbox-img').src = '';
}
function resetDemo() {
  if (!confirm('Wipe local demo data? You\'ll be signed out and any photos/notes you added on this device will be cleared.')) return;
  localStorage.removeItem(STATE_KEY);
  state = loadState();
  location.hash = '/';
  render();
}

function attachScrollHandler() {
  const tb = document.getElementById('topbar');
  if (!tb) return;
  const onScroll = () => tb.classList.toggle('scrolled', window.scrollY > 8);
  if (window._scrollH) window.removeEventListener('scroll', window._scrollH);
  window._scrollH = onScroll;
  window.addEventListener('scroll', onScroll, { passive: true });
  onScroll();
}

function errorScreen(msg) {
  return `<div class="center-state" style="min-height:100dvh;">
    <div class="glyph" style="background:var(--red-soft); color:var(--red);">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
    </div>
    <h3>Couldn't load schedule</h3>
    <p>${esc(msg)}</p>
  </div>`;
}

init();
</script>
</body>
</html>
